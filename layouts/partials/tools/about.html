{{- $slug := . -}}
{{- $guide := partial "tools/guide.html" $slug -}}
{{- with $guide.about }}
<section class="tool-about">
  <h2>About this tool</h2>
  <p>{{ . }}</p>
  {{- with $guide.faq }}
  <h2>Questions</h2>
  <dl class="tool-faq">
    {{- range . }}
    <dt>{{ .q }}</dt>
    <dd>{{ .a }}</dd>
    {{- end }}
  </dl>
  {{- end }}
</section>
{{- end }}
