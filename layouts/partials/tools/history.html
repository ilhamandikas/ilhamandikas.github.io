<section class="tool-history" id="tool-history" hidden>
  <div class="tool-history-head">
    <div>
      <h2 class="tool-history-title">History tool ini</h2>
      <p class="tool-history-subtitle">Data terakhir yang pernah kamu isi di tool ini, tersimpan hanya di device/browser ini.</p>
    </div>
    <button class="tool-history-link" type="button" id="tool-history-clear"
            title="Remove every previous entry for this tool, keeping the current one">Clear history</button>
  </div>
  <ol class="tool-history-list" id="tool-history-list"></ol>
</section>
