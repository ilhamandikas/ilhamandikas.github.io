<div class="tool-panel">
  <h2>Watermark</h2>
  <label class="tool-field">
    <span>Image</span>
    <input id="wmt-file" class="tool-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
  </label>
  <label class="tool-field">
    <span>Text</span>
    <input id="wmt-text" class="tool-input" type="text" value="© ilham.dev">
  </label>
  <div class="imc-grid">
    <label class="tool-field">
      <span>Position</span>
      <select id="wmt-position" class="tool-select">
        <option value="bottom-right" selected>Bottom right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="top-right">Top right</option>
        <option value="top-left">Top left</option>
        <option value="center">Centre</option>
      </select>
    </label>
    <label class="tool-field">
      <span>Size <output id="wmt-size-value">4</output>%</span>
      <input id="wmt-size" class="tool-range" type="range" min="1" max="12" step="0.5" value="4">
    </label>
  </div>
  <div class="imc-grid">
    <label class="tool-field">
      <span>Colour</span>
      <input id="wmt-color" class="tool-input" type="color" value="#ffffff">
    </label>
    <label class="tool-field">
      <span>Opacity <output id="wmt-opacity-value">80</output>%</span>
      <input id="wmt-opacity" class="tool-range" type="range" min="10" max="100" step="5" value="80">
    </label>
  </div>
  <div class="tool-row">
    <label class="tool-check"><input type="checkbox" id="wmt-date"> Add today's date</label>
    <label class="tool-check"><input type="checkbox" id="wmt-outline" checked> Dark outline for contrast</label>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="wmt-download" disabled>Download</button>
    <span class="tool-status" id="wmt-status"></span>
  </div>
  <p class="tool-hint">The text is drawn straight onto the pixels, so it survives sharing and screenshots. The size is a percentage of the shorter side, which keeps it in proportion on a wide or a tall picture.</p>
</div>

<div class="tool-panel" id="wmt-preview" hidden>
  <h2>Preview</h2>
  <div class="imc-preview-wrap">
    <canvas id="wmt-canvas" class="imc-canvas" width="600" height="400"></canvas>
  </div>
</div>
