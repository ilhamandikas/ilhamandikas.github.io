<div class="tool-panel">
  <div class="tool-field">
    <label for="hash-input">Text</label>
    <textarea id="hash-input" class="tool-input" rows="6" spellcheck="false" placeholder="Text to hash…"></textarea>
  </div>

  <div class="tool-row">
    <label class="tool-check"><input type="checkbox" id="hash-md5" checked> MD5</label>
    <label class="tool-check"><input type="checkbox" id="hash-sha1" checked> SHA-1</label>
    <label class="tool-check"><input type="checkbox" id="hash-sha256" checked> SHA-256</label>
    <label class="tool-check"><input type="checkbox" id="hash-sha512" checked> SHA-512</label>
    <label class="tool-check"><input type="checkbox" id="hash-upper"> Uppercase</label>
  </div>

  <div id="hash-results"></div>
</div>
