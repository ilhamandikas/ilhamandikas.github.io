<div class="tool-panel">
  <div class="tool-row">
    <label class="tool-inline">Title <input type="text" id="meta-title" class="tool-text" value="My page"></label>
    <label class="tool-inline">Description <input type="text" id="meta-desc" class="tool-text" value="A short description"></label>
  </div>
  <div class="tool-row">
    <label class="tool-inline">URL <input type="text" id="meta-url" class="tool-text" value="https://example.com/"></label>
    <label class="tool-inline">Image <input type="text" id="meta-image" class="tool-text" value="https://example.com/cover.png"></label>
  </div>
  <div class="tool-row">
    <label class="tool-inline">Type
      <select id="meta-type" class="tool-select">
        <option>website</option>
        <option>article</option>
        <option>product</option>
        <option>profile</option>
      </select>
    </label>
    <label class="tool-inline">Twitter <input type="text" id="meta-twitter" class="tool-text" value="@site"></label>
    <label class="tool-inline">Locale <input type="text" id="meta-locale" class="tool-text" value="en_US"></label>
  </div>
  <div class="tool-field">
    <label for="meta-output">HTML</label>
    <textarea id="meta-output" class="tool-input" rows="12" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#meta-output" data-status="#meta-status">Copy</button>
    <button class="btn" type="button" data-download="#meta-output" data-filename="meta-tags.html" data-mime="text/html">Download</button>
    <span class="tool-status" id="meta-status"></span>
  </div>
</div>
