<div class="tool-panel">
  <h2>Request</h2>
  <div class="hrt-request-grid">
    <label class="tool-field">
      <span>Method</span>
      <select id="hrt-method" class="tool-select">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>PATCH</option>
        <option>DELETE</option>
        <option>HEAD</option>
        <option>OPTIONS</option>
      </select>
    </label>
    <label class="tool-field hrt-url">
      <span>URL</span>
      <input type="text" id="hrt-url" class="tool-text" placeholder="https://api.example.com/v1/things"
             spellcheck="false" autocomplete="off" autocapitalize="off">
    </label>
    <div class="hrt-send-actions">
      <button class="btn primary" type="button" id="hrt-send">Send</button>
      <button class="btn" type="button" id="hrt-cancel" hidden>Cancel</button>
    </div>
  </div>
  <p class="tool-status" id="hrt-status"></p>

  <div class="hrt-options-grid">
    <label class="tool-field">
      <span>Body</span>
      <select id="hrt-body-type" class="tool-select">
        <option value="none">No body</option>
        <option value="json">JSON</option>
        <option value="form">Form URL-encoded</option>
        <option value="text">Plain text</option>
      </select>
    </label>
    <label class="tool-field">
      <span>Timeout</span>
      <span class="tool-affix"><input type="number" id="hrt-timeout" class="tool-number" min="500" max="120000" step="500" value="15000"> ms</span>
    </label>
    <label class="tool-check hrt-check-card">
      <input type="checkbox" id="hrt-credentials"> Send cookies
    </label>
  </div>

  <label class="tool-field">
    <span>Headers — one per line, as <code>Name: value</code></span>
    <textarea id="hrt-headers" class="tool-text" rows="4" spellcheck="false"
              placeholder="Accept: application/json"></textarea>
  </label>

  <label class="tool-field" id="hrt-body-field">
    <span>Request body</span>
    <textarea id="hrt-body" class="tool-text" rows="6" spellcheck="false"
              placeholder="{&quot;name&quot;: &quot;a thing&quot;}"></textarea>
  </label>

  <p class="tool-hint">
    The request goes from <em>your</em> browser straight to the address you type — nothing is relayed through this site. Browser CORS rules still apply. Need to paste or generate a command? Use the <a href="/tools/curl-tester/">curl Tester</a>.
  </p>
</div>

<div class="tool-panel">
  <h2>Response</h2>
  <div class="tool-row">
    <span class="tool-note" id="hrt-meta"></span>
    <button class="btn" type="button" id="hrt-copy-body">Copy body</button>
    <button class="btn" type="button" id="hrt-copy-headers">Copy headers</button>
  </div>
  <label class="tool-field">
    <span>Headers</span>
    <textarea id="hrt-res-headers" class="tool-text" rows="5" readonly spellcheck="false"></textarea>
  </label>
  <label class="tool-field">
    <span>Body <span class="tool-muted">— pretty-printed when it is JSON</span></span>
    <textarea id="hrt-res-body" class="tool-text" rows="14" readonly spellcheck="false"></textarea>
  </label>
</div>
