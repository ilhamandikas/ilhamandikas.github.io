<div class="tool-panel">
  <h2>Redact a screenshot</h2>
  <label class="tool-field">
    <span>Image</span>
    <input id="spc-file" class="tool-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
  </label>
  <div class="imc-grid">
    <label class="tool-field">
      <span>Redaction</span>
      <select id="spc-mode" class="tool-select">
        <option value="pixelate" selected>Pixelate</option>
        <option value="black">Black box</option>
      </select>
    </label>
    <label class="tool-field">
      <span>Pixel block <output id="spc-block-value">24</output> px</span>
      <input id="spc-block" class="tool-range" type="range" min="8" max="80" step="4" value="24">
    </label>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" id="spc-undo" disabled>Undo last</button>
    <button class="btn" type="button" id="spc-reset" disabled>Reset</button>
    <button class="btn primary" type="button" id="spc-download" disabled>Download</button>
    <span class="tool-status" id="spc-status"></span>
  </div>
  <p class="tool-hint">Drag on the picture to draw a box over anything private: an email address, a phone number, an IP address or a line of text. Nothing is found for you, because reading text out of an image would need OCR, and the picture never leaves this device.</p>
</div>

<div class="tool-panel" id="spc-preview" hidden>
  <h2>Preview</h2>
  <div class="imc-preview-wrap">
    <canvas id="spc-canvas" class="imc-canvas" width="600" height="400"></canvas>
  </div>
</div>
