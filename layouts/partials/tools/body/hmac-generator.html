<div class="tool-panel">
  <div class="tool-field">
    <label for="hmac-text">Text</label>
    <textarea id="hmac-text" class="tool-input" rows="5" spellcheck="false" placeholder="Message to sign…"></textarea>
  </div>
  <div class="tool-row">
    <label class="tool-inline">Key <input type="text" id="hmac-key" class="tool-text" value="secret"></label>
    <label class="tool-inline">Algorithm
      <select id="hmac-algo" class="tool-select">
        <option>SHA-256</option>
        <option>SHA-1</option>
        <option>SHA-384</option>
        <option>SHA-512</option>
      </select>
    </label>
    <label class="tool-inline">Output
      <select id="hmac-format" class="tool-select">
        <option value="hex">Hex</option>
        <option value="base64">Base64</option>
      </select>
    </label>
  </div>
  <div class="tool-field">
    <label for="hmac-output" id="hmac-output-label">HMAC (hex)</label>
    <textarea id="hmac-output" class="tool-input" rows="3" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#hmac-output" data-status="#hmac-status">Copy</button>
    <span class="tool-status" id="hmac-status" role="status" aria-live="polite"></span>
  </div>
  <div class="tool-field">
    <label for="hmac-expected">Verify (paste an expected HMAC)</label>
    <textarea id="hmac-expected" class="tool-input" rows="2" spellcheck="false" placeholder="Paste a hex or base64 HMAC to compare…"></textarea>
  </div>
  <p class="tool-status" id="hmac-verify-status" role="status" aria-live="polite"></p>
</div>
