<div class="tool-panel">
  <h2>Network Info</h2>
  <p class="tool-hint">A snapshot of what the browser exposes about this device and its connection: online state, the Network Information values where supported, screen and viewport size, language and time zone. It is read locally and never uploaded.</p>
  <button type="button" class="btn" id="ni-refresh">Refresh</button>
  <p class="tool-status" id="ni-status" role="status" aria-live="polite"></p>
</div>

<div class="tool-panel">
  <h2>Details</h2>
  <dl class="tool-results" id="ni-out"></dl>
</div>
