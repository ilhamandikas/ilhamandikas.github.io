<div class="tool-panel">
  <div class="tool-row">
    <label class="tool-inline">Modulus
      <select id="rsa-size" class="tool-select">
        <option value="2048">2048-bit</option>
        <option value="3072">3072-bit</option>
        <option value="4096">4096-bit</option>
      </select>
    </label>
    <button class="btn primary" type="button" id="rsa-generate">Generate key pair</button>
    <span class="tool-status" id="rsa-status"></span>
  </div>
  <div class="tool-field">
    <label for="rsa-public">Public key (PEM)</label>
    <textarea id="rsa-public" class="tool-input" rows="9" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#rsa-public" data-status="#rsa-status">Copy public</button>
  </div>
  <div class="tool-field">
    <label for="rsa-private">Private key (PEM)</label>
    <textarea id="rsa-private" class="tool-input" rows="12" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#rsa-private" data-status="#rsa-status">Copy private</button>
  </div>
</div>
