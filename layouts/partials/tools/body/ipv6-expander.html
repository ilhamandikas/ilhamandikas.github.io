<div class="tool-panel">
  <h2>IPv6 Expander</h2>
  <label class="tool-field">
    <span>IPv6 address</span>
    <input type="text" id="ipv6-input" class="tool-input" value="2001:db8::1" autocomplete="off" spellcheck="false" placeholder="2001:db8::1">
  </label>
  <p class="tool-hint">Paste a compressed, expanded, prefixed or IPv4-mapped address. The page shows the full eight-group form, the canonical compressed form, the prefix, any zone index and what kind of address it is. Everything runs in the browser.</p>
  <p class="tool-status" id="ipv6-status" role="status" aria-live="polite"></p>
</div>

<div class="tool-panel">
  <h2>Result</h2>
  <dl class="tool-results" id="ipv6-out"></dl>
</div>
