<div class="tool-panel">
  <div class="tool-field">
    <label for="otp-secret">Secret (Base32)</label>
    <input type="text" id="otp-secret" class="tool-input" value="JBSWY3DPEHPK3PXP" spellcheck="false" autocapitalize="off" autocomplete="off">
  </div>
  <div class="tool-row">
    <label class="tool-inline">Digits
      <select id="otp-digits" class="tool-select">
        <option>6</option>
        <option>8</option>
      </select>
    </label>
    <label class="tool-inline">Period
      <input type="number" id="otp-period" class="tool-number" min="10" max="120" value="30">
    </label>
    <label class="tool-inline">Algorithm
      <select id="otp-algo" class="tool-select">
        <option>SHA-1</option>
        <option>SHA-256</option>
        <option>SHA-512</option>
      </select>
    </label>
  </div>
  <div class="tool-field">
    <label>Current code</label>
    <p class="tool-timer" id="otp-code">------</p>
  </div>
  <p class="tool-status" id="otp-status"></p>
</div>
