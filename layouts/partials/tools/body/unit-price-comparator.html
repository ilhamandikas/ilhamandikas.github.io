<div class="tool-panel">
  <h2>Unit Price Comparator</h2>
  <label class="tool-field">
    <span>One product per line: name, price, quantity, unit</span>
    <textarea id="upc-input" class="tool-input tool-code" rows="6" spellcheck="false">Kopi 250 g, 30000, 250, g
Kopi 1000 g, 95000, 1000, g
Air 600 ml, 4000, 600, ml
Air 1500 ml, 8000, 1500, ml</textarea>
  </label>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#upc-output" data-status="#upc-status">Copy</button>
    <span class="tool-status" id="upc-status"></span>
  </div>
</div>

<div class="tool-panel">
  <h2>Ranked by unit price</h2>
  <pre id="upc-output" class="tool-result"></pre>
  <p class="tool-hint">Use plain numbers for price and quantity, without thousand separators. The units ml, l, g, kg, m and cm are normalised, so a 1 litre bottle and a 600 ml bottle are compared on the same scale. The star marks the cheapest in each group.</p>
</div>
