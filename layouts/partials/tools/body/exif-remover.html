<div class="tool-panel">
  <h2>Strip metadata</h2>
  <label class="tool-field">
    <span>Image</span>
    <input id="exf-file" class="tool-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
  </label>
  <div class="imc-grid">
    <label class="tool-field">
      <span>Output format</span>
      <select id="exf-format" class="tool-select">
        <option value="original" selected>Keep original</option>
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
      </select>
    </label>
    <label class="tool-field">
      <span>Quality <output id="exf-quality-value">90</output></span>
      <input id="exf-quality" class="tool-range" type="range" min="50" max="100" step="1" value="90">
    </label>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="exf-download" disabled>Download clean image</button>
    <span class="tool-status" id="exf-status"></span>
  </div>
  <p class="tool-hint">Re-encoding an image through a canvas rebuilds the pixels and carries nothing else along, so the EXIF block with the camera, the capture time and the GPS position is left behind. The picture is processed on this device.</p>
</div>

<div class="tool-panel" id="exf-preview" hidden>
  <h2>Result</h2>
  <div class="imc-sizes">
    <p><span class="imc-label">Original</span><span id="exf-original">—</span></p>
    <p><span class="imc-label">Clean</span><span id="exf-output">—</span></p></p>
  </div>
  <div class="imc-preview-wrap">
    <canvas id="exf-canvas" class="imc-canvas" width="600" height="400"></canvas>
  </div>
</div>
