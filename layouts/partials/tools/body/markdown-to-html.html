<div class="tool-panel">
  <div class="tool-field">
    <label for="md-input">Markdown</label>
    <textarea id="md-input" class="tool-input" rows="10" spellcheck="false" placeholder="# Hello&#10;&#10;Write **Markdown** here…"></textarea>
  </div>
  <div class="tool-field">
    <label>Preview</label>
    <div id="md-preview" class="tool-doc"></div>
  </div>
  <div class="tool-field">
    <label for="md-output">HTML</label>
    <textarea id="md-output" class="tool-input" rows="8" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#md-output" data-status="#md-status">Copy</button>
    <button class="btn" type="button" data-download="#md-output" data-filename="document.html" data-mime="text/html">Download</button>
    <span class="tool-status" id="md-status"></span>
  </div>
</div>
