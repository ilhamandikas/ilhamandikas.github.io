<div class="tool-panel">
  <div class="tool-row">
    <div class="tool-field" style="flex:1">
      <label for="td-left">Original text</label>
      <textarea id="td-left" class="tool-input" rows="10" spellcheck="false"></textarea>
    </div>
    <div class="tool-field" style="flex:1">
      <label for="td-right">Changed text</label>
      <textarea id="td-right" class="tool-input" rows="10" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="td-run">Compare</button>
    <span class="tool-status" id="td-status"></span>
  </div>
  <div class="tool-diff" id="td-diff"></div>
</div>
