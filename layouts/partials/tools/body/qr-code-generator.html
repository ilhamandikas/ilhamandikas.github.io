<div class="tool-panel">
  <div class="tool-field">
    <label for="qr-text">Text or URL</label>
    <textarea id="qr-text" class="tool-input" rows="3" spellcheck="false" placeholder="https://example.com">https://ilham.dev</textarea>
  </div>
  <div class="tool-row">
    <label class="tool-inline">Size
      <input type="number" id="qr-size" class="tool-number" min="64" max="1024" value="256">
    </label>
    <label class="tool-inline">Margin
      <input type="number" id="qr-margin" class="tool-number" min="0" max="10" value="2">
    </label>
    <label class="tool-inline">Error correction
      <select id="qr-ecc" class="tool-select">
        <option value="L">L · 7%</option>
        <option value="M" selected>M · 15%</option>
        <option value="Q">Q · 25%</option>
        <option value="H">H · 30%</option>
      </select>
    </label>
  </div>
  <div class="tool-row">
    <label class="tool-inline">Foreground <input type="text" id="qr-fg" class="tool-text" value="#0f172a"></label>
    <label class="tool-inline">Background <input type="text" id="qr-bg" class="tool-text" value="#ffffff"></label>
  </div>
  <div class="tool-field">
    <label>Preview</label>
    <div id="qr-preview" class="tool-preview"></div>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" id="qr-png">Download PNG</button>
    <button class="btn" type="button" id="qr-svg">Download SVG</button>
    <span class="tool-status" id="qr-status"></span>
  </div>
</div>
