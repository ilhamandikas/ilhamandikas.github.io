<div class="tool-panel">
  <div class="tool-row" id="wys-toolbar">
    <button class="btn" type="button" data-cmd="bold"><b>Bold</b></button>
    <button class="btn" type="button" data-cmd="italic"><i>Italic</i></button>
    <button class="btn" type="button" data-cmd="underline"><u>Underline</u></button>
    <button class="btn" type="button" data-cmd="formatBlock" data-value="h2">Heading</button>
    <button class="btn" type="button" data-cmd="insertUnorderedList">• List</button>
    <button class="btn" type="button" data-cmd="insertOrderedList">1. List</button>
    <button class="btn" type="button" id="wys-link">Link</button>
    <button class="btn" type="button" data-cmd="removeFormat">Clear</button>
  </div>
  <div class="tool-field">
    <label>Editor</label>
    <div id="wys-editor" class="tool-editor" contenteditable="true"><p>Write something…</p></div>
  </div>
  <div class="tool-field">
    <label for="wys-output">HTML</label>
    <textarea id="wys-output" class="tool-input" rows="8" readonly spellcheck="false"></textarea>
  </div>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#wys-output" data-status="#wys-status">Copy HTML</button>
    <span class="tool-status" id="wys-status"></span>
  </div>
</div>
