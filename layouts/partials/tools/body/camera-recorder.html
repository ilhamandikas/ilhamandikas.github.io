<div class="tool-panel">
  <div class="tool-field">
    <label>Preview</label>
    <video id="cam-video" class="tool-video" autoplay muted playsinline></video>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="cam-start">Start camera</button>
    <button class="btn" type="button" id="cam-record" disabled>Start recording</button>
    <button class="btn" type="button" id="cam-stop" disabled>Stop recording</button>
    <a class="btn" id="cam-download" download="recording.webm" hidden>Download</a>
    <span class="tool-status" id="cam-status"></span>
  </div>
</div>
