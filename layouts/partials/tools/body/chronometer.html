<div class="tool-panel">
  <p class="tool-timer" id="chrono-display">00:00.00</p>
  <div class="tool-row">
    <button class="btn primary" type="button" id="chrono-toggle">Start</button>
    <button class="btn" type="button" id="chrono-lap">Lap</button>
    <button class="btn" type="button" id="chrono-reset">Reset</button>
    <span class="tool-status" id="chrono-status"></span>
  </div>
  <dl id="chrono-laps" class="tool-results"></dl>
</div>
