<div class="tool-panel">
  <h2>Extract pages</h2>
  <label class="tool-field">
    <span>PDF file</span>
    <input id="ppe-file" class="tool-input" type="file" accept="application/pdf,.pdf">
  </label>
  <div class="imc-grid">
    <label class="tool-field">
      <span>Pages to keep</span>
      <input id="ppe-range" class="tool-input" type="text" value="1-2" placeholder="e.g. 1-3, 7, 10-">
    </label>
    <label class="tool-field">
      <span>Output name</span>
      <input id="ppe-name" class="tool-input" type="text" value="extracted.pdf">
    </label>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="ppe-download" disabled>Download</button>
    <span class="tool-status" id="ppe-status"></span>
  </div>
  <p class="tool-hint">The pages you ask for are copied into a new document, so anything left out really is gone from the result. A range can be written as 1-3, as a single page such as 7, or open-ended as 5- or -3.</p>
</div>

<div class="tool-panel" id="ppe-result" hidden>
  <h2>Result</h2>
  <div class="imc-sizes">
    <p><span class="imc-label">Source</span><span id="ppe-source">—</span></p>
    <p><span class="imc-label">Kept</span><span id="ppe-kept">—</span></p>
    <p><span class="imc-label">Output</span><span id="ppe-output">—</span></p>
  </div>
</div>
