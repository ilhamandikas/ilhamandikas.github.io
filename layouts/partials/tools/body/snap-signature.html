<div class="tool-panel">
  <h2>SNAP BI Asymmetric Signature</h2>
  <p class="tool-hint">Build the string to sign and sign or verify it with SHA256withRSA, the way Bank Indonesia's SNAP BI standard and Midtrans notifications do. Keys and data stay in your browser.</p>
  <div class="snap-grid">
    <label class="tool-field">
      <span>Action</span>
      <select id="snap-mode" class="tool-select">
        <option value="generate">Generate (private key)</option>
        <option value="verify" selected>Verify (public key)</option>
      </select>
    </label>
    <label class="tool-field">
      <span>HTTP method</span>
      <input id="snap-method" class="tool-input" type="text" value="POST" spellcheck="false" autocomplete="off">
    </label>
    <label class="tool-field">
      <span>Endpoint URL</span>
      <input id="snap-endpoint" class="tool-input" type="text" value="/v1.0/debit/notify" spellcheck="false" autocomplete="off">
    </label>
    <label class="tool-field">
      <span>X-TIMESTAMP</span>
      <div class="int-inline">
        <input id="snap-timestamp" class="tool-input" type="text" value="2024-05-02T14:43:08+07:00" spellcheck="false" autocomplete="off">
        <button class="btn" type="button" id="snap-now">Now</button>
      </div>
    </label>
  </div>
  <label class="tool-field">
    <span>Body</span>
    <textarea id="snap-body" class="tool-input tool-code" rows="6" spellcheck="false">{"originalPartnerReferenceNo":"GP24043015193402809","originalReferenceNo":"A120240430081940S9vu8gSjaRID","merchantId":"G099333790","amount":{"value":"102800.00","currency":"IDR"},"latestTransactionStatus":"00","transactionStatusDesc":"SUCCESS","additionalInfo":{"refundHistory":[]}}</textarea>
  </label>
  <div class="snap-grid">
    <label class="tool-field">
      <span>Private key (PKCS#8 PEM)</span>
      <textarea id="snap-private" class="tool-input tool-code" rows="6" spellcheck="false" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>
    </label>
    <label class="tool-field">
      <span>Public key (SPKI PEM)</span>
      <textarea id="snap-public" class="tool-input tool-code" rows="6" spellcheck="false">-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlWbtlh3eM+bW3n5AFj42
wddC4L7tQqbLiCFbTv8K67yng9iwK5mEn+UMXiRhvB2JVWFafCPPxFamsiVG3Mjn
eGjC0BYgmpmw4qXnAnyO3nCdCuPtmZ3ljhKvSTPdWZxrcLi1Xa9V/+Pzb8hrjb5i
wMn6SZFNeMmZYgFKiSeueo6TPln2PoTqXCzs1HtsM8eUVe8GAsjJe/3dYl992nyX
OpG21GgNu8o5T3WOptPg6GdDTWkTWUu483yRbVVy04Pz4L8DDZTDv+WcsAViDn1r
A/jB1Auj/UGKx2ovGcBH/a/hor5TbABbODU6cPTHT54K3sSZtvZNV4eFDB1f/4wd
fwIDAQAB
-----END PUBLIC KEY-----</textarea>
    </label>
  </div>
  <p class="tool-hint" id="snap-key-hint"></p>
  <div class="tool-field" id="snap-signature-field">
    <span>X-SIGNATURE (base64)</span>
    <textarea id="snap-signature" class="tool-input tool-code" rows="4" spellcheck="false">RoJnP2tH/YiOhHM/lMVBMSAuzRmS8VrWdIy04Qqyb56daV7oWFMFoMMzqnjQ+q0MIUalYgU094GWQnCx2c29xb1kkqHhv2+iJ9xl6NjGmFGYqyvcKvUDAV83Y1Mw9JnsEcjcupdGw9/MRv/mm2GMrQ+BCZGfc4a46JDyPZbcY294vDGqs5rFBN6iYer5ro4cAQGo9hET2G82Y+j50vCyO/79GFE4vB1rvtu6PK2Bxi+vTYV8k7P7PS8tOPWM2O+kjiVWjwvLR99Botou+a8sxlQqZaihfWMKcByzV+Lgkr9cptpjys+1NIRWT1ad/sJBSLHyldzC3q2oRn5z5oZmyg==</textarea>
  </div>
  <div class="tool-row">
    <button class="btn primary" type="button" id="snap-run">Verify</button>
    <button class="btn" type="button" id="snap-keygen">Generate key pair</button>
    <button class="btn" type="button" id="snap-sample">Load sample</button>
    <span class="tool-status" id="snap-status" role="status" aria-live="polite"></span>
  </div>
</div>

<div class="tool-panel">
  <h2>String to sign</h2>
  <label class="tool-field">
    <span>minify(body)</span>
    <textarea id="snap-minified" class="tool-input tool-code" rows="3" readonly spellcheck="false"></textarea>
  </label>
  <label class="tool-field">
    <span>lowercase(hex(SHA-256(minify(body))))</span>
    <input id="snap-hash" class="tool-input tool-code" type="text" readonly spellcheck="false">
  </label>
  <label class="tool-field">
    <span>HTTPMethod : EndpointUrl : hash : X-TIMESTAMP</span>
    <textarea id="snap-string" class="tool-input tool-code" rows="3" readonly spellcheck="false"></textarea>
  </label>
  <div class="tool-row">
    <button class="btn" type="button" data-copy="#snap-string" data-status="#snap-status">Copy string to sign</button>
    <button class="btn" type="button" data-copy="#snap-out" data-status="#snap-status">Copy result</button>
  </div>
</div>

<div class="tool-panel">
  <h2>Result</h2>
  <label class="tool-field">
    <span>Signature / verdict</span>
    <textarea id="snap-out" class="tool-input tool-code" rows="4" readonly spellcheck="false"></textarea>
  </label>
</div>
