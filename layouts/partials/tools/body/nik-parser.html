<div class="tool-panel">
  <h2>NIK</h2>

    <span>National ID number (NIK)</span>
    <input type="text" id="nik-input" class="tool-input" value="3171010101900001" inputmode="numeric" maxlength="19" autocomplete="off" spellcheck="false" placeholder="16-digit NIK">

  <dl class="tool-results" id="nik-results"></dl>
