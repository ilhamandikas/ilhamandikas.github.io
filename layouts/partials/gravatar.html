{{- $email := site.Params.email -}}
{{- $hash := md5 (lower $email) -}}
{{- $size := site.Params.gravatarSize | default 240 -}}
<img class="avatar" src="https://www.gravatar.com/avatar/{{ $hash }}?s={{ $size }}&amp;d=mp&amp;r=g"
     width="{{ $size }}" height="{{ $size }}" alt="{{ site.Params.author }}" loading="lazy" decoding="async">
