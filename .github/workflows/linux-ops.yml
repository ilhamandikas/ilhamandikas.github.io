name: linux-ops

on:
  push:
    branches: [main]
    paths:
      - 'apps/linux-ops/**'
      - '.github/workflows/linux-ops.yml'
  pull_request:
    paths:
      - 'apps/linux-ops/**'
      - '.github/workflows/linux-ops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/linux-ops
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-ops/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the committed build output is current
        run: git diff --exit-code -- ../../assets/linux-ops
