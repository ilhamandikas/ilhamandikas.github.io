# Long-form content for tool pages, keyed by slug.
#
# This is the part of a tool page a search engine has something to read. A tool
# page is otherwise just a form and some labels, which gives a crawler almost
# nothing to match a query against.
#
# Only tools listed here get an "About" + "Questions" section. There is no
# generated fallback on purpose: padding every page with near-identical filler
# would be worse than leaving it out.
#
# Fields:
#   about: one honest paragraph — what it does, how, and what it will not do
#   faq:   questions people actually ask, answered properly

qr-code-generator:
  about: >-
    This builds a QR code in your browser from any text or URL, with a choice of
    error-correction level and an adjustable margin. The code is produced locally
    by a bundled encoder, so the text you type is never sent anywhere. You can
    take the result as a PNG for a chat message or as an SVG, which is drawn as
    vector paths and therefore stays sharp at any print size.
  faq:
    - q: "Do I need an account, or is there a limit?"
      a: "No account, no API key and no quota. The generator runs entirely in the page."
    - q: "Which error-correction level should I choose?"
      a: "H is the most robust and survives roughly 30% of the pattern being damaged, at the cost of a denser code. Use L for short URLs on a screen, and H for anything printed on a sticker, a label or packaging that might get scuffed."
    - q: "Why did the PNG download fail?"
      a: "Drawing to a canvas can be blocked in some environments. The SVG download is pure vector, works everywhere and scales better for print anyway."
    - q: "How large can a logo be before the code stops scanning?"
      a: "Smaller than the error-correction percentage suggests, because correction works per block rather than across the whole symbol — a centred logo destroys one or two blocks outright while the overall average still looks healthy. Measured with an independent decoder over three payload lengths, the largest logo that still scanned was 12% of the code's width at L, 16% at M, 18% at Q and 24% at H, with the default white box behind it taken into account. Those numbers come from testing, not from arithmetic, and the page's hint turns red once you pass the limit for the level you chose."

wifi-qr-generator:
  about: >-
    Enter a network name, password and security type and this builds the standard
    WIFI: payload that Android and iOS understand, then renders it as a QR code.
    Scanning it joins the network without anyone typing a password, which is what
    makes it useful for guests, an office wall or a rental. The credentials stay
    in the page and are never put in the URL.
  faq:
    - q: "Does it work on an iPhone?"
      a: "Yes. The Camera app on iOS 11 and later reads Wi-Fi QR codes directly, with no extra app installed."
    - q: "Is it safe to print the password in a QR code?"
      a: "Treat a printed code exactly like the password itself — anyone who can photograph it can join the network. If you hand one out and later change your mind, change the password."
    - q: "Which security type should I pick?"
      a: "WPA/WPA2 for essentially every modern network, including WPA3 routers that still accept WPA2 clients. Use WEP only for genuinely old hardware, and 'no password' only for an open network."

json-formatter:
  about: >-
    Paste JSON and this validates it, pretty-prints it at the indentation you
    choose, or minifies it back down. The optional sort control reorders object
    keys at every level, ascending or descending, while leaving array order
    alone — which is exactly what you want when two API responses differ only in
    key order. Parsing uses the browser's own JSON parser, so it fails on exactly
    what a real parser fails on.
  faq:
    - q: "Does sorting also reorder arrays?"
      a: "No, and that is deliberate. Only object keys are reordered. Array order is data, so changing it would change the meaning of the document."
    - q: "What is the difference between this and the JSON Viewer?"
      a: "This one gives you text you can copy and paste. The viewer renders a collapsible tree, which is better for finding your way around a document whose shape you do not know yet."
    - q: "Is my data uploaded anywhere?"
      a: "No. Parsing happens locally with JSON.parse and nothing leaves the browser."

json-viewer:
  about: >-
    A collapsible tree view of a JSON document, with a count of the nested values
    on each branch and buttons to expand or collapse everything at once. It is
    built for finding your way around a payload you have not seen before — an API
    response, a config file, a webhook body. The document is parsed locally.
  faq:
    - q: "Can it open a large file?"
      a: "It handles documents in the megabytes. The browser still has to lay out every visible node, so very large files are easier to explore with the deep branches left collapsed."
    - q: "Can I get a single value out?"
      a: "Yes. The tree is there for reading, and the JSON Formatter is the tool for copying the whole document back out as text."

json-diff:
  about: >-
    Compare two JSON documents and see what was added, removed or changed, key by
    key. Because both sides are parsed first, differences in whitespace and key
    order are ignored and only real changes are reported — which makes it far
    more useful than eyeballing two formatted blobs.
  faq:
    - q: "Does key order count as a difference?"
      a: "No. Both documents are parsed and compared as structures, so reordering keys is not a change."
    - q: "Can it merge the two documents?"
      a: "No. It reports differences. Merging is a separate decision that depends on which side should win, and that is a judgement the tool cannot make for you."

base64-string-converter:
  about: >-
    Encode UTF-8 text to Base64, or decode it back, with an optional URL-safe
    alphabet where + and / become - and _ and the padding is dropped. Multi-byte
    characters are handled correctly because the text is encoded to UTF-8 bytes
    first, so accented letters and emoji round-trip without corruption.
  faq:
    - q: "What is URL-safe Base64 for?"
      a: "Standard Base64 uses + and /, both of which have to be escaped inside a URL. The URL-safe variant swaps them for - and _ so the value can sit in a query string or a filename untouched."
    - q: "Is Base64 a form of encryption?"
      a: "No. It is a reversible encoding with no key, and anyone can decode it. Use the AES tool if you need actual confidentiality."

base64-file-converter:
  about: >-
    Turn any file into a Base64 string, or a Base64 string back into a file. It
    is most useful for embedding a small image or font directly in a stylesheet
    as a data URI, or for working out what a data URI you were handed actually
    contains. The file is read locally through the File API.
  faq:
    - q: "Is there a size limit?"
      a: "Whatever your browser can hold in memory. Base64 inflates a file by about a third, so a 3 MB image becomes roughly 4 MB of text."
    - q: "Should I embed images as data URIs?"
      a: "Only for small files. A data URI cannot be cached separately from the stylesheet it lives in and it has to be parsed along with it, so anything past a few kilobytes is usually better served as an ordinary file."

hash-text:
  about: >-
    Compute MD5, SHA-1, SHA-256 and SHA-512 digests of any text. SHA-256 and
    SHA-512 use the browser's WebCrypto implementation; MD5 and SHA-1 are here
    because they still turn up in checksums and older protocols, not because
    they are safe for anything that matters.
  faq:
    - q: "Can I use MD5 for passwords?"
      a: "No. MD5 and SHA-1 are broken for anything security-related — both have practical collision attacks, and neither is designed to be slow. Use bcrypt or Argon2 for passwords."
    - q: "Why is there no SHA-3?"
      a: "WebCrypto does not expose it. Adding it would mean shipping a JavaScript implementation, which would be slower than native code and easy to get subtly wrong."

uuid-generator:
  about: >-
    Generate version 4 UUIDs, one at a time or in bulk, using the browser's
    cryptographic random number generator. They are suitable for database keys,
    request IDs and anything else that has to be unique without coordinating with
    a central authority.
  faq:
    - q: "Can two generated UUIDs collide?"
      a: "A v4 UUID carries 122 random bits. You would need to generate around 2.7×10^18 of them before a collision became likely, which is far beyond any realistic workload."
    - q: "Are these UUIDs predictable?"
      a: "No. They come from crypto.getRandomValues rather than Math.random, so earlier values tell you nothing about later ones."

ulid-generator:
  about: >-
    ULIDs are 128-bit identifiers like UUIDs, except the first 48 bits are a
    millisecond timestamp. That makes them sortable by creation time while
    staying unique, which is handy as a primary key when you want insertion order
    without keeping a separate timestamp column.
  faq:
    - q: "Should I use a ULID or a UUID?"
      a: "ULIDs if you want keys that sort by creation time and stay roughly chronological. UUIDs if you need the widest possible support, or must not reveal when a record was created."
    - q: "Are ULIDs case-sensitive?"
      a: "The canonical form is uppercase Crockford Base32, and that is what this tool produces."

token-generator:
  about: >-
    Generate random tokens and passwords of a chosen length from a chosen
    character set, drawn from the browser's cryptographic random source. Useful
    for API keys, session secrets and share links.
  faq:
    - q: "How long should a token be?"
      a: "For a machine-generated secret, 32 characters from a mixed alphabet is about 190 bits of entropy, which is far past brute force. Length buys you more than character variety does."
    - q: "Is Math.random good enough for this?"
      a: "No. Math.random is a fast seeded generator whose output can be predicted from previous values. This tool uses crypto.getRandomValues instead."

password-strength:
  about: >-
    Estimate how much work a password represents by measuring its entropy,
    assuming a specific number of guesses per second, and reporting how long a
    cracking rig would need. It is an estimate with stated assumptions rather
    than a verdict, which is the honest way to present this.
  faq:
    - q: "Why does my password score badly?"
      a: "Usually because it is short, or built from a predictable pattern. Length adds entropy far faster than swapping letters for symbols, so a long passphrase nearly always beats a short complicated string."
    - q: "Is my password sent anywhere?"
      a: "No. The estimate is computed in the page and nothing is transmitted."

jwt-parser:
  about: >-
    Decode the header, payload and claims of a JSON Web Token, and check its
    signature. It shows the signing algorithm, the registered claims and when the
    token expires, and flags the pitfalls worth noticing — an alg: none header, or
    an exp that has already passed. Signature checking covers HMAC (HS256/384/512),
    RSASSA-PKCS1-v1_5 (RS256/384/512), RSA-PSS (PS256/384/512) and ECDSA
    (ES256/384/512).
  faq:
    - q: "Does this verify the signature?"
      a: "Yes, in the Check the signature panel, for HS, RS, PS and ES algorithms. Paste the shared secret for HMAC tokens or the PEM public key for the rest, and it recomputes the signature over the header and payload exactly as they arrived. That is why editing the payload by even one character flips the answer to a mismatch."
    - q: "Does a valid signature mean the token is trustworthy?"
      a: "No. It only means the token was signed by whoever holds the key you pasted. It says nothing about whether that issuer is one you trust, and it does not enforce exp, nbf, aud or iss — those are separate checks your application still has to make."
    - q: "Why is alg: none refused?"
      a: "Because alg: none means the token is unsigned, so anyone who can edit it can also rewrite the payload. A verifier that accepts the algorithm named in the token is the classic algorithm-confusion bug; here the algorithm is read from the header so the right primitive is chosen, and none is always reported as a failure."
    - q: "Is it safe to paste a token here?"
      a: "The decoding and the signature check both happen in your browser and nothing is uploaded. Even so, a token is a live credential — use a throwaway one when you are testing, and never paste a production secret."

timestamp-converter:
  about: >-
    Convert between Unix timestamps, ISO 8601 strings and local time, in both
    directions. It handles seconds and milliseconds, which is the mix-up that
    produces dates in 1970 or in the year 55000.
  faq:
    - q: "Is my timestamp in seconds or milliseconds?"
      a: "A ten-digit number is seconds; a thirteen-digit number is milliseconds. JavaScript's Date.now() returns milliseconds, while most Unix tooling works in seconds."
    - q: "Why is my date off by a day?"
      a: "Almost always a timezone issue. The converter shows UTC and your local zone side by side so you can see which one you were reading."

crontab-generator:
  about: >-
    Build a cron expression from its five fields and read it back in plain
    English, so you can check a schedule before it quietly does the wrong thing
    at 3am. It also covers the special strings like @daily and @reboot.
  faq:
    - q: "Why does 0 0 * * * run at midnight UTC?"
      a: "Cron uses the server's timezone. On most servers that is UTC unless the crontab sets CRON_TZ, or the machine itself is configured otherwise."
    - q: "Does this schedule the job?"
      a: "No. It only builds and explains the expression. Nothing is scheduled and nothing runs."

regex-tester:
  about: >-
    Test a regular expression against sample text and see every match highlighted
    as you type, with the capture groups listed separately. It uses JavaScript's
    own regex engine, so what you see here is what you get in a script.
  faq:
    - q: "Why does my pattern behave differently in Python or grep?"
      a: "The dialects differ. JavaScript has no atomic groups or possessive quantifiers, and lookbehind support is comparatively recent. The tool shows which flags it is applying."
    - q: "Why does .* match more than I expected?"
      a: "Greedy quantifiers take as much as they can and then backtrack. Append ? to make it lazy — .*? stops at the first opportunity."

regex-cheatsheet:
  about: >-
    A searchable reference for regular-expression syntax: character classes,
    anchors, quantifiers, groups, lookarounds and the flags that change how
    matching behaves.
  faq:
    - q: "Which dialect does this describe?"
      a: "The syntax is common to most engines. Where JavaScript, PCRE and POSIX diverge, the entry says so explicitly."

color-converter:
  about: >-
    Convert a colour between HEX, RGB, RGBA, HSL, HSLA and CMYK, with a live
    preview. It accepts shorthand hex and alpha channels, and reports the nearest
    CSS colour name when there is one.
  faq:
    - q: "Why is the CMYK value approximate?"
      a: "CMYK describes ink on paper and depends on the printer profile. The value here is the standard naive conversion, which is a reasonable starting point but not something to send to a print house."
    - q: "Does HSL use degrees?"
      a: "Yes. Hue is 0–360 degrees, while saturation and lightness are percentages."

chmod-calculator:
  about: >-
    Convert between octal permissions and symbolic ones, toggling read, write and
    execute for owner, group and others. It shows the resulting chmod command
    and the rwxr-xr-x string side by side, so you can check one against the
    other before running anything.
  faq:
    - q: "What is the difference between 644 and 755?"
      a: "644 gives the owner read and write and everyone else read, which is the normal choice for files. 755 adds execute for everyone, which is what directories and scripts need."
    - q: "What does a leading digit mean?"
      a: "It carries the setuid, setgid and sticky bits — 1777 for a shared directory like /tmp, for example."

ip-lookup:
  about: >-
    Show the public IP address you are connecting from, or look up any address,
    along with its country, region, city, coordinates, timezone and ISP. This is
    one of the few tools on this site that talks to the internet: it uses free,
    key-less services and falls back to a second one if the first is unavailable.
  faq:
    - q: "Why does it show a different city than where I am?"
      a: "Geolocation is based on the address your ISP has registered, not on your physical position, so it usually lands on the nearest city where the provider has infrastructure."
    - q: "Which services does it use?"
      a: "ipwho.is first, then freeipapi.com. Both are free and need no API key, and the tool tells you which one answered."
    - q: "Does this site store my address?"
      a: "No. The request goes from your browser straight to the provider and the result is rendered here. Nothing is logged by this site."

dns-lookup:
  about: >-
    Resolve A, AAAA, CNAME, MX, TXT, NS, SOA, CAA and SRV records over
    DNS-over-HTTPS, so the query travels over an encrypted connection instead of
    plain UDP on port 53. It asks Cloudflare first, falls back to Google, and
    reports which resolver answered.
  faq:
    - q: "Why is there no ANY query?"
      a: "Both Cloudflare and Google refuse ANY over DoH and return NOTIMP. Querying each record type individually is what the resolvers actually support."
    - q: "Is this the same as dig?"
      a: "Same records, different transport. dig speaks DNS on port 53; this uses HTTPS, so it works from networks that block port 53 and cannot be tampered with in transit."
    - q: "Why do I get a different answer than my own resolver?"
      a: "You are asking a public resolver with its own cache. A different answer usually means a different cache state, or a CDN handing back the node nearest to the resolver rather than to you."

whois-lookup:
  about: >-
    Show the registrar, registration and expiry dates, status codes and
    nameservers for a domain. It reads the registry's own RDAP service,
    discovered from the IANA bootstrap directory, so there is no third-party
    proxy in the middle. When a registry publishes no RDAP service at all, the
    tool says so instead of guessing.
  faq:
    - q: "Why do some domains return nothing?"
      a: "A few registries publish no RDAP endpoint at all — .io, .co, .de and several other ccTLDs among them. Without one there is no machine-readable record to fetch."
    - q: "Why is the registrant hidden?"
      a: "Since GDPR, most registries redact personal details on private registrations. The tool tells you when the response has been redacted rather than showing blanks."
    - q: "What is the difference between RDAP and WHOIS?"
      a: "RDAP is the structured HTTPS replacement for the old port-43 WHOIS protocol. It returns JSON instead of free text, so the fields can be labelled reliably rather than pattern-matched."

ipv4-subnet-calculator:
  about: >-
    Given an address and a prefix length, work out the network address, broadcast
    address, netmask, wildcard mask and usable host range, along with the total
    and usable host counts.
  faq:
    - q: "Why is the usable host count two less than the total?"
      a: "The first address in a subnet is the network address and the last is the broadcast address, and neither can be assigned to a host. The exceptions are /31 and /32, which the tool handles separately."
    - q: "Can it plan a VLSM layout?"
      a: "Not directly. Use it to check one block at a time, or the range expander to see which CIDR blocks cover an arbitrary range exactly."

ipv4-address-converter:
  about: >-
    Convert an IPv4 address between dotted-decimal, a single 32-bit integer,
    hexadecimal, octal and binary, and show the four octets broken out.
  faq:
    - q: "Why does 127.0.0.1 become 2130706433?"
      a: "The four octets are the bytes of one 32-bit number: 127×256³ + 0×256² + 0×256 + 1. That is why some sites accept the decimal form as the same address."
    - q: "Why would I need the integer form?"
      a: "Firewalls, access rules and some APIs store addresses as integers because they are cheaper to compare and range-check than strings."

ipv4-range-expander:
  about: >-
    Given a start and end address, list the CIDR blocks that cover the range
    exactly, so you can turn an arbitrary range into something a firewall or a
    route table will accept.
  faq:
    - q: "Why does it return several blocks instead of one?"
      a: "CIDR blocks are always powers of two, so an arbitrary range almost never lands on one. The tool finds the smallest set of blocks that covers it without going over."

markdown-to-html:
  about: >-
    Render Markdown to HTML in the browser, with the generated markup shown as
    text so you can copy it straight into a template. It handles headings, lists,
    tables, code fences, links and inline formatting.
  faq:
    - q: "Is the output sanitised?"
      a: "The renderer follows Markdown rules and passes raw HTML through. If you are rendering Markdown written by strangers, sanitise the result before putting it on a page."
    - q: "Which flavour of Markdown is this?"
      a: "CommonMark with the usual table and strikethrough extensions — GitHub-flavoured in practice."

text-diff:
  about: >-
    Compare two blocks of text line by line and see exactly which lines were
    added, removed or left alone. Useful for checking what actually changed
    between two versions of a config, a query or a paragraph.
  faq:
    - q: "Does it compare word by word?"
      a: "It compares line by line, which is the right granularity for configs and code. A whitespace-only change still shows up as a change."
    - q: "Is there a version for structured data?"
      a: "Yes. The JSON Diff tool compares two documents structurally, so it ignores formatting and key order and reports only real differences."

slugify:
  about: >-
    Turn any text into a URL-safe slug: lowercased, accents folded to ASCII,
    punctuation dropped and words joined with a separator you choose. Non-Latin
    scripts are transliterated where that is possible.
  faq:
    - q: "Why should a slug be ASCII?"
      a: "Percent-encoded characters are hard to read, easy to mangle when copied and awkward in analytics. A plain ASCII slug survives every tool it passes through."
    - q: "Should I use dashes or underscores?"
      a: "Dashes. Search engines treat a hyphen as a word separator and an underscore as joining two words, so my-post reads as two words and my_post as one."

url-encoder:
  about: >-
    Percent-encode and decode URL components, either the whole string or one
    component at a time. The distinction matters more than it looks: encoding a
    full URL turns its own ? and & into data, which is usually not what you want.
  faq:
    - q: "Should I encode the whole URL or just a parameter?"
      a: "Almost always just the parameter. Use component mode when the value goes inside a query string, and whole-URL mode only when the URL itself is the data being passed along."

lorem-ipsum:
  about: >-
    Generate placeholder text as paragraphs, sentences or words, starting from
    the classic Latin passage or a shuffled word pool. It is for filling a layout
    before the real copy exists.
  faq:
    - q: "Why not just write the real copy first?"
      a: "Because placeholder text makes it obvious what is a layout problem and what is a content problem, and it stops a review turning into an edit of the words instead of the design."
    - q: "Is the Latin real?"
      a: "It is a mangled excerpt of Cicero, which is the traditional joke. It is not meaningful Latin."

otp-generator:
  about: >-
    Generate time-based one-time passwords (TOTP, RFC 6238) from a shared secret,
    and verify a code you have been given. It shows the current code, the seconds
    until it rolls over and the next code, so you can compare against a device
    that may have drifted.
  faq:
    - q: "Is my secret sent anywhere?"
      a: "No. The HMAC is computed locally with WebCrypto. That said, do not paste a production secret into any page you do not control — including this one."
    - q: "Why does the code not match my authenticator app?"
      a: "Almost always clock drift. TOTP depends on both sides agreeing which 30-second window it is; the tool shows the remaining seconds so you can see the disagreement."

meta-tag-generator:
  about: >-
    Generate the meta tags a page needs for search and for social sharing: title,
    description, canonical, Open Graph and Twitter card tags, with a preview of
    how the result will look.
  faq:
    - q: "How long should a meta description be?"
      a: "Around 150–160 characters. Search engines truncate past that, and they will sometimes replace your description with text lifted from the page."
    - q: "Do Open Graph tags affect ranking?"
      a: "Not directly. They affect how a shared link looks, which affects whether people click it — and clicks are a signal."

http-status-codes:
  about: >-
    A searchable reference of HTTP response status codes, what each one means and
    when a server should return it.
  faq:
    - q: "When should I return 401 instead of 403?"
      a: "401 means the request is unauthenticated — the client should try again with credentials. 403 means it is authenticated but not allowed, and trying again will not help."
    - q: "Does 200 always mean success?"
      a: "For a GET, usually. For an API, a 200 carrying an error object is a common and unhelpful habit. Prefer a status code that matches the outcome."

svg-placeholder:
  about: >-
    Create a placeholder image as an SVG: pick the size, background and text
    colour and get a small vector file to drop into a layout while the real image
    is being produced.
  faq:
    - q: "Why SVG rather than a PNG?"
      a: "It is a few hundred bytes, stays sharp at any size and can be edited in a text editor. There is no reason to ship a bitmap for a solid rectangle."

roman-numeral:
  about: >-
    Convert between Roman numerals and decimal numbers, using the subtractive
    notation for 4, 9, 40, 90, 400 and 900. It covers 1 to 3999, which is the
    range the plain notation reaches without an overline.
  faq:
    - q: "Why does it stop at 3999?"
      a: "Standard Roman notation has no zero and no way to write larger numbers without an overline or a different convention. 3999 is MMMCMXCIX, the largest value the plain form expresses."

percentage-calculator:
  about: >-
    Work out percentages in the forms that actually come up: what X% of Y is,
    what percentage X is of Y, and the increase or decrease between two values.
  faq:
    - q: "Why do a percentage rise and fall not cancel out?"
      a: "Because they are relative to different bases. A 50% rise followed by a 50% fall leaves you at 75% of where you started, not back at the beginning."

temperature-converter:
  about: >-
    Convert between Celsius, Fahrenheit and Kelvin, with the formulas shown so
    you can check the arithmetic rather than trusting it.
  faq:
    - q: "Is there a temperature where Celsius and Fahrenheit agree?"
      a: "Yes, at −40 degrees. It is the single point where the two scales cross."

math-evaluator:
  about: >-
    Evaluate a mathematical expression with the usual operators, parentheses,
    functions and constants, and assign variables to reuse an intermediate
    result.
  faq:
    - q: "Is it safe to paste an expression in?"
      a: "Yes. The expression is parsed and evaluated as arithmetic. It is not handed to eval, so it cannot run arbitrary code."

docker-run-to-compose:
  about: >-
    Turn a docker run command into a docker-compose.yml service, mapping ports,
    volumes, environment variables, restart policy and the command into their
    Compose equivalents.
  faq:
    - q: "Does it understand every flag?"
      a: "It covers the common ones — ports, volumes, environment, restart, network, command and entrypoint. Anything it does not recognise is reported rather than silently dropped."

text-statistics:
  about: >-
    Count characters, words, sentences, paragraphs and lines, with and without
    spaces, plus an estimated reading time. Useful for checking a draft against a
    length limit.
  faq:
    - q: "How is the reading time worked out?"
      a: "Words divided by a fixed reading speed. It is a rough figure — technical material with code reads considerably slower than prose."

mime-types:
  about: >-
    Look up the MIME type for a file extension, or work backwards from a type to
    the extensions it covers.
  faq:
    - q: "Why does one extension have two types?"
      a: "Because of history. .js is text/javascript today, but application/javascript still appears in older configurations, and servers generally accept both."

mac-address-lookup:
  about: >-
    Look up the vendor registered to a MAC address's OUI — its first three
    octets — against the bundled IEEE registry.
  faq:
    - q: "Why does a lookup return nothing?"
      a: "Virtual machines and randomised addresses do not come from a registered OUI. Most phones now randomise their MAC per network, so a vendor lookup is often meaningless on modern hardware."

iban-validator:
  about: >-
    Validate an IBAN with the MOD-97 checksum, and read back the country, the
    check digits and the domestic account part.
  faq:
    - q: "Does a valid IBAN mean the account exists?"
      a: "No. The checksum only proves the string was not mistyped. It says nothing about whether the account is real or still open."

phone-parser:
  about: >-
    Parse and format a phone number by country, showing the international and
    national forms, the country calling code and whether the number is valid for
    that region.
  faq:
    - q: "Why does a number I know is real show as invalid?"
      a: "Validation checks the length and prefix rules for the selected region. A number can be genuinely in service and still fail those rules, for example if it was issued before a numbering plan change."

case-converter:
  about: >-
    Switch text between camelCase, PascalCase, snake_case, kebab-case,
    CONSTANT_CASE, Title Case and sentence case, with word boundaries inferred
    from the separators and capitalisation already present.
  faq:
    - q: "How does it split words that are already joined together?"
      a: "It splits on separators and on the case boundaries it can see, so getHTTPResponse becomes get, HTTP, Response. Where the input is ambiguous it can only ever be a guess."

ascii-text-drawer:
  about: >-
    Render text as large ASCII-art banners using a bundled FIGlet-compatible
    font, and copy the result as plain text. It is for README headers, code
    comments and terminal output.
  faq:
    - q: "Will the banner line up everywhere?"
      a: "Only in a monospaced font. In a proportional font the columns collapse, which is why the preview here is monospaced."

html-entities:
  about: >-
    Escape and unescape HTML special characters, choosing between named entities
    and numeric ones, so text can be embedded safely in a page or a snippet read
    back to see what it really contains. It escapes what needs escaping rather
    than every non-ASCII character, which keeps the output readable.
  faq:
    - q: "Which characters actually need escaping?"
      a: "In HTML text content, & and <. Inside an attribute value, also the quote character you are using to delimit it. Escaping more than that is harmless but makes the source noisy."

text-to-binary:
  about: >-
    Convert text to its UTF-8 bytes written in binary, and back again. Each
    character is shown as the eight bits that encode it, which is the clearest
    way to see how a string becomes bytes on the wire.
  faq:
    - q: "Why is one character sometimes more than eight bits?"
      a: "Because it is not ASCII. UTF-8 uses one byte for ASCII characters and up to four for others, so an accented letter or an emoji comes out as two or more groups of eight bits."

text-to-unicode:
  about: >-
    Show the Unicode code points behind a piece of text, as U+XXXX escapes and as
    decimal values, and turn those escapes back into text. It is the quickest way
    to find out what an invisible or look-alike character actually is.
  faq:
    - q: "What is the difference between a code point and a UTF-8 byte?"
      a: "A code point is the abstract character number. UTF-8 is one particular way of writing that number as bytes, so the same code point can occupy a different number of bytes in a different encoding."
    - q: "Why does text I copied have an invisible character in it?"
      a: "Usually a zero-width space or a non-breaking space picked up from a web page or a word processor. Listing the code points is what makes it visible."

text-to-nato-alphabet:
  about: >-
    Spell out text using the NATO phonetic alphabet — Alfa, Bravo, Charlie —
    which is what you use when a word has to survive a noisy phone line.
  faq:
    - q: "Why Alfa and Juliett, with a double t?"
      a: "Both spellings were chosen so that speakers of languages which do not distinguish those sounds still pronounce them correctly. The spelling is deliberate, not a typo."

string-obfuscator:
  about: >-
    Hide part of a string while leaving enough of it visible to recognise — the
    usual way to show a card number, an API key or an email address in a log, a
    ticket or a screenshot without exposing the whole value.
  faq:
    - q: "Is this a security measure?"
      a: "No. It is a presentation aid. The original value is still wherever you copied it from, and masking is not the same thing as redaction."

safelink-decoder:
  about: >-
    Extract the real destination from an Outlook SafeLink, which wraps the
    original URL in a redirect through Microsoft's safelinks service. It decodes
    the url parameter and shows where the link genuinely goes.
  faq:
    - q: "Why do SafeLinks exist?"
      a: "Microsoft rewrites links in email so it can scan the destination at click time and block it later if it turns malicious. That is why the address you see is not the real one."

basic-auth-generator:
  about: >-
    Build the Authorization: Basic header value from a username and password, and
    optionally produce a ready-to-use curl command. The encoding is plain Base64,
    which is exactly why it is only safe over HTTPS.
  faq:
    - q: "Is Basic authentication encrypted?"
      a: "No. The credentials are Base64-encoded, which anyone can reverse. They are protected only by the TLS connection carrying them, so never use it over plain HTTP."

json-minifier:
  about: >-
    Strip the whitespace out of a JSON document while keeping it valid, so it
    takes fewer bytes over the wire. It parses first and re-serialises, so a
    malformed document is rejected rather than mangled.
  faq:
    - q: "How much smaller does it get?"
      a: "Typically 20–40% for hand-formatted JSON. If the server gzips its responses the gain is mostly redundant, because gzip already removes repeated whitespace."

json-to-yaml:
  about: >-
    Convert JSON to YAML, preserving the structure rather than reformatting the
    text. It is the usual way to move a config between a tool that speaks one and
    a file that is written in the other.
  faq:
    - q: "Are comments kept?"
      a: "JSON has no comments, so converting JSON to YAML cannot invent any. Going the other way, YAML comments are dropped because JSON has nowhere to put them."
    - q: "Why does my document fail to convert?"
      a: "Usually an anchor or a custom tag with no equivalent, or a duplicate key. The error names the position."

yaml-to-json:
  about: >-
    Convert YAML to JSON, preserving nesting, arrays and types. Anchors and
    aliases are resolved, so the output is the effective document rather than the
    shorthand used to write it.
  faq:
    - q: "What happens to a non-string key?"
      a: "JSON requires string keys, so numeric and boolean keys are converted to their string form. That is a real difference between the two formats, not a bug."
    - q: "Are duplicate keys allowed?"
      a: "No. YAML permits them but almost every parser takes the last one silently, which hides mistakes. This tool reports them instead."

yaml-to-toml:
  about: >-
    Convert YAML to TOML, preserving nesting, arrays and types. TOML has no null,
    so a null value is reported rather than quietly dropped or turned into an
    empty string.
  faq:
    - q: "What happens to a null value?"
      a: "TOML has no null type, so it cannot be represented. The converter tells you which key it was, so you can decide what the absence should mean."
    - q: "Does key order survive?"
      a: "Yes, and it matters in TOML, because keys have to be defined before any table that uses them. The converter keeps the order it was given."

json-to-toml:
  about: >-
    Convert JSON to TOML, mapping objects to tables and arrays of tables to the
    TOML equivalent. Useful for turning an API response into a config file.
  faq:
    - q: "Why is a nested structure sometimes rejected?"
      a: "TOML requires that a table is fully defined before it is extended. A document that is legal JSON can therefore be inexpressible in TOML without restructuring, and the tool says so rather than emitting something invalid."

toml-to-json:
  about: >-
    Convert TOML to JSON, turning tables into nested objects and arrays of tables
    into arrays. Dates and datetimes are kept as strings in their TOML form.
  faq:
    - q: "How are TOML dates represented?"
      a: "JSON has no date type, so they become ISO 8601 strings — the same text, with the type information lost. That is a limitation of the target format."

toml-to-yaml:
  about: >-
    Convert TOML to YAML, turning tables into nested mappings and arrays of
    tables into sequences. Handy when a tool wants YAML but the config is written
    in TOML.
  faq:
    - q: "How are TOML dates represented?"
      a: "As ISO 8601 strings. YAML does have a timestamp type, but writing one that other parsers agree on is unreliable, so plain strings are the safer output."

xml-formatter:
  about: >-
    Pretty-print or minify XML at the indentation you choose. It parses the
    document first, so mismatched and unclosed tags are reported instead of being
    passed through.
  faq:
    - q: "Does it preserve CDATA and comments?"
      a: "Yes. Both are kept as they are; only the whitespace between elements changes."
    - q: "Why does it refuse my file?"
      a: "The parser is strict. A stray ampersand, an undeclared namespace prefix or a mismatched tag will stop it, and the error names the position."

xml-to-json:
  about: >-
    Convert XML to JSON. XML is a document format and JSON is a data format, so
    the mapping has to make decisions — attributes, text content and repeated
    elements all need a shape — and the tool states which convention it uses.
  faq:
    - q: "Is the conversion reversible?"
      a: "Not always, and no converter can promise that. XML can express things JSON cannot, such as mixed text and elements, or the same attribute twice. Check the output before relying on a round trip."

json-to-xml:
  about: >-
    Convert JSON to XML, with a root element you choose and a stated convention
    for arrays, attributes and primitive values.
  faq:
    - q: "What happens to an array?"
      a: "Each item becomes an element with the same name, which is the standard convention. The tool shows the rule it applied so the output is predictable."

json-to-csv:
  about: >-
    Flatten an array of JSON objects into CSV, using the union of the keys as the
    header row. It is the usual way to get an API response into a spreadsheet.
  faq:
    - q: "What happens to nested objects?"
      a: "They are flattened into dotted column names like user.address.city. An array inside a row is joined into a single cell, because CSV has no way to express nesting."
    - q: "Why are some cells empty?"
      a: "Because not every object has every key. The header is the union of all keys, so an object missing one simply leaves that cell blank."

sql-prettify:
  about: >-
    Reformat a SQL query with consistent indentation and uppercased keywords, so
    a one-line statement pasted out of a log becomes something you can read. It
    reformats; it does not validate.
  faq:
    - q: "Does it understand my dialect?"
      a: "It knows the common keywords and the usual quoting styles. It will not tell you whether the query is valid for your database, or whether it will do what you meant."

yaml-viewer:
  about: >-
    A collapsible tree view of a YAML document, showing the structure and the
    value counts on each branch. Anchors and aliases are resolved, so you see the
    effective document rather than the shorthand.
  faq:
    - q: "Are YAML anchors expanded?"
      a: "Yes, which means the tree shows what the document means rather than how it was written. That is usually what you want, but it does hide where the reuse came from."

list-converter:
  about: >-
    Turn a list into the shape you need: one item per line, comma-separated, a
    JSON array, a SQL IN clause or a numbered list. Useful for turning a column
    pasted out of a spreadsheet into something a query or a script will accept.
  faq:
    - q: "Does it deduplicate or sort?"
      a: "Only if you ask it to. By default the order and the duplicates are exactly as you pasted them."
    - q: "Why is my SQL IN clause broken?"
      a: "Almost always because an item contained a single quote. The tool escapes what it can, but read the output before running it."

hmac-generator:
  about: >-
    Compute an HMAC over a message using SHA-256, SHA-384 or SHA-512 and a shared
    secret, which is how a webhook signature is normally verified. The
    computation uses WebCrypto.
  faq:
    - q: "What is the difference between an HMAC and a plain hash?"
      a: "A plain hash proves nothing about who produced it. An HMAC mixes in a secret, so only someone holding that secret can produce the same value — which is what lets you verify that a webhook came from the service you expect."

bcrypt:
  about: >-
    Hash a password with bcrypt, or verify a password against an existing bcrypt
    hash. The cost factor controls how much work each hash takes, and that
    expense is the whole point.
  faq:
    - q: "Which cost factor should I use?"
      a: "The highest one your server can afford at login time. The tool reports how long each hash took, which is the number that matters — a login should not take much more than about 250 ms."
    - q: "Why does the same password give a different hash every time?"
      a: "Because bcrypt generates a random salt per hash and stores it inside the result. That is what stops two users who chose the same password from having the same hash."

aes-encryption:
  about: >-
    Encrypt and decrypt text with AES-GCM using a passphrase, with the key
    derived by PBKDF2. The output is a self-contained Base64 blob carrying the
    salt and the initialisation vector, so it can be decrypted later with the
    passphrase alone.
  faq:
    - q: "Is this strong enough for real data?"
      a: "AES-GCM and PBKDF2 are sound primitives and the construction is standard. What it cannot protect you from is a weak passphrase, or forgetting it — there is no recovery path."
    - q: "Why does the ciphertext change every time?"
      a: "Because a fresh random salt and IV are generated for each encryption. The same plaintext and passphrase therefore produce a different blob, which is the intended behaviour."
    - q: "Is the passphrase sent anywhere?"
      a: "No. Deriving the key and encrypting both happen in the browser."

rsa-key-pair:
  about: >-
    Generate an RSA key pair in the browser with WebCrypto, in PEM form, ready to
    paste into an SSH or TLS configuration — and check whether a public key and a
    private key you already have are actually a pair. The private key never leaves
    the page unless you copy it out.
  faq:
    - q: "How many bits should the key be?"
      a: "2048 is the accepted minimum today. 4096 is slower to generate and to use for a modest margin, and 1024 should be treated as broken."
    - q: "How do you tell whether two keys match?"
      a: "WebCrypto cannot derive one key from the other, so the check signs a fixed throwaway message with the private key and asks the public key to verify it. If the signature verifies, the two halves share a modulus and are a genuine pair. The probe message is a constant, so the same two keys always give the same answer."
    - q: "Which key formats are accepted for the check?"
      a: "PKCS#8 and PKCS#1 for private keys, SPKI and PKCS#1 for public keys — that is BEGIN PRIVATE KEY, BEGIN RSA PRIVATE KEY, BEGIN PUBLIC KEY and BEGIN RSA PUBLIC KEY. The PKCS#1 forms are what openssl genrsa and openssl rsa -RSAPublicKey_out print, so they are wrapped into PKCS#8 or SPKI before WebCrypto sees them rather than rejected."
    - q: "Is a key generated in a browser trustworthy?"
      a: "The cryptography is the same WebCrypto implementation your browser uses for TLS, so the maths is sound. What you have to trust is the page itself, which is why generating keys offline is the safer habit for anything that matters."

bip39:
  about: >-
    Generate a BIP-39 mnemonic phrase from a chosen word count and derive the
    seed from it, which is how a cryptocurrency wallet backs up a key as words.
    It also checks a phrase you were given for a valid checksum.
  faq:
    - q: "Is it safe to generate a wallet seed in a browser?"
      a: "The entropy comes from crypto.getRandomValues, so the randomness is real. The risk is the page and the machine, not the maths. For anything holding real value, generate offline on a machine you control."
    - q: "Why does it reject my phrase?"
      a: "The last word carries a checksum. If one word was mistyped the checksum fails and the phrase is rejected, which is the feature working as intended."

pdf-signature-checker:
  about: >-
    Read a PDF and report the signatures it contains: who signed, when, and
    whether the byte range each signature covers still matches the file. It walks
    the PDF structure directly, with no upload and no external library.
  faq:
    - q: "Does this prove the signer's identity?"
      a: "No. It checks that the signature covers the current bytes and reports the certificate details. Whether to trust that certificate is a separate judgement, and this tool does not make it for you."
    - q: "Why is a signature reported as invalid?"
      a: "Usually because the file was changed after it was signed, which is the check doing its job. It can also happen with signature formats the reader does not recognise."

ipv6-ula-generator:
  about: >-
    Generate a random IPv6 unique local address prefix in fd00::/8, following
    RFC 4193, for a network that should never be routed on the public internet.
  faq:
    - q: "What is the difference between fc00::/7 and fd00::/8?"
      a: "The whole range is fc00::/7. The fd00::/8 half is where the 40-bit global ID is generated locally rather than assigned by a registry, which is the practical choice."

mac-address-generator:
  about: >-
    Generate random MAC addresses, optionally holding a prefix so the result
    stays inside a vendor range you specify.
  faq:
    - q: "Can I use a generated MAC on a real network?"
      a: "Technically yes, but if it collides with another device on the same segment both will break. Keep the locally-administered bit set so the address cannot clash with a registered vendor range."

random-port-generator:
  about: >-
    Pick one or more port numbers, with the option to stay above 1024 and to
    avoid the ports that are usually already taken.
  faq:
    - q: "Does it check whether the port is free?"
      a: "No. A browser cannot scan ports on another host. This picks numbers that are unlikely to clash — you still have to check your own machine."

url-parser:
  about: >-
    Break a URL into its parts — scheme, host, port, path, query parameters and
    fragment — and show each one both raw and decoded. It is the quickest way to
    see what a tracking-heavy link is really carrying.
  faq:
    - q: "Why is each parameter shown twice?"
      a: "Once percent-encoded exactly as it appears in the URL, and once decoded. The difference between the two is usually the interesting part."
    - q: "Why does a repeated parameter appear twice in the list?"
      a: "Because it is genuinely there twice. Repeated parameters are legal and often significant, so every occurrence is kept rather than the last one winning."

user-agent-parser:
  about: >-
    Break a user-agent string into browser, version, engine and operating system,
    and explain what each part is for.
  faq:
    - q: "Why is the browser detected wrongly?"
      a: "Because user-agent strings lie, deliberately. Every browser claims to be Mozilla, and some reduce or freeze the rest of the string. Treat any detection as a hint, and feature-detect instead whenever you can."

keycode-info:
  about: >-
    Press a key and see everything the browser reports about it: the key name,
    the legacy keyCode and whichCode, the physical position on the keyboard, and
    which modifier keys were held. It is for wiring up a shortcut without
    guessing.
  faq:
    - q: "Why is keyCode deprecated?"
      a: "It is inconsistent across layouts and languages — the same physical key reports different values. Use event.key for the character and event.code for the physical position, and press a key here to see the difference."

device-information:
  about: >-
    Show what the browser reports about the current device: screen and viewport
    size, pixel ratio, platform, language, timezone, CPU core count, memory where
    it is exposed, and whether the device claims to support touch.
  faq:
    - q: "Why is the reported platform sometimes wrong?"
      a: "User-agent strings are unreliable, and some browsers deliberately reduce them for privacy. Treat what you see as a hint rather than a fact."

camera-recorder:
  about: >-
    Record a short video from your webcam and download it. Nothing is uploaded —
    the recording is captured with MediaRecorder and held in memory until you
    save it.
  faq:
    - q: "Why can it not reach my camera?"
      a: "Camera access needs HTTPS and an explicit permission grant. If the button is disabled, the browser is missing MediaRecorder or reports no camera."
    - q: "Where does the recording go?"
      a: "Into memory in this tab, and then into your downloads folder when you save it. No part of it is sent anywhere."

html-wysiwyg-editor:
  about: >-
    A small rich-text editor that writes HTML, with bold, italic, headings, lists
    and links, and shows the markup it produced so you can copy it out.
  faq:
    - q: "Is the generated HTML clean?"
      a: "It is browser-generated, which is tidier than a word processor's output but still carries some inline styling. Expect to tidy it before using it in production."

git-cheatsheet:
  about: >-
    A searchable reference for the Git commands that come up less often: undoing
    a commit, recovering a deleted branch, rewriting history, and finding which
    commit introduced a line.
  faq:
    - q: "Is it safe to run these commands?"
      a: "Read what each one does first. The entries that rewrite history are marked, because on a shared branch they affect everyone who has pulled it."

emoji-picker:
  about: >-
    Search and copy emoji by name, with the whole set available rather than the
    subset your keyboard happens to offer.
  faq:
    - q: "Why do some emoji render as boxes?"
      a: "The font on your system does not include them. The character is still correct and will render wherever the font supports it."

numeronym:
  about: >-
    Turn a long word into a numeronym — the first letter, the number of letters
    omitted and the last letter, so internationalization becomes i18n.
  faq:
    - q: "Why is it called a numeronym?"
      a: "Because the omitted letters are replaced by their count. The pattern long predates the web — a11y for accessibility, k8s for Kubernetes, l10n for localization."

base-converter:
  about: >-
    Convert a number between binary, octal, decimal, hexadecimal and any base up
    to 36, working on the digits directly so long values are not rounded by
    floating point.
  faq:
    - q: "Why does the value not change when I paste a very long number?"
      a: "Because it should not. This converter works on the digits rather than through a floating-point number, so a 64-bit value keeps every digit — which is the whole reason to use it instead of a calculator."
    - q: "How are values above 9 written in base 36?"
      a: "With the letters A–Z after the digits, so 35 is Z and 36 is 10."

eta-calculator:
  about: >-
    Estimate a finish time from how much is done, how long it took and how much
    is left, assuming the current rate holds.
  faq:
    - q: "How accurate is it?"
      a: "Only as accurate as the assumption that the remaining work resembles the work already done. It is most useful for spotting an overrun early, not for planning."

chronometer:
  about: >-
    A stopwatch with lap times, counting in tenths of a second, for timing
    something without leaving the browser.
  faq:
    - q: "Does it keep running if I switch tabs?"
      a: "Yes. The elapsed time is computed from a clock reading rather than by counting ticks, so a backgrounded tab cannot make it drift."

benchmark-builder:
  about: >-
    Compare a set of measured values and see each one as a ratio against the
    fastest, so the differences are readable without doing the arithmetic.
  faq:
    - q: "Why ratios rather than percentages?"
      a: "Because 2.4× slower is easier to act on than 140% slower, and it does not break down when the baseline is the smallest value."

email-normalizer:
  about: >-
    Normalise an email address to a canonical form: lowercase the domain, strip a
    +tag from the local part, and remove dots for providers where they are
    ignored. Useful for deduplicating a mailing list.
  faq:
    - q: "Is removing dots always safe?"
      a: "No. Dots are only ignorable at specific providers — Gmail and a few others. At most providers first.last and firstlast are genuinely different mailboxes, so only apply this when you know the domain."

qr-editor:
  about: >-
    A QR code generator with the full set of style controls: module shape,
    finder-corner shape, a two-colour gradient, a transparent background, and a
    logo with its own size, padding, corner radius and background box. Six presets
    set the whole look at once if you would rather not tune each part. The encoder
    runs in the page, so the text and any logo you load stay on your machine. The
    hint under the Logo heading tracks the error-correction budget as you resize
    the logo and tells you when the code is likely to stop scanning.
  faq:
    - q: "How big can the logo be before the code stops scanning?"
      a: "That depends on the error-correction level, and the answer is smaller than the percentage suggests. Error correction works per block, not across the whole symbol, so a centred logo wipes out one or two blocks outright while the overall average still looks fine. Measured with an independent decoder, the largest logo that still scanned was 12% of the code's width at L, 16% at M, 18% at Q and 24% at H — with the default white box behind it, which erases modules of its own. The hint turns red past that number for the level you picked."
    - q: "Why is the round finder corner called a dot rather than a circle?"
      a: "Because the outer ring stays a rounded square. A fully circular outer ring broke detection outright in testing — the symbol stopped decoding with either a square or a round centre. A rounded square ring decoded with both. The dot style therefore rounds the ring and draws the inner 3x3 as a dot, which is the look people are after without the part that does not work."
    - q: "What is the difference between this and the plain QR Code Generator?"
      a: "They share the same encoder and both export PNG and SVG. This one adds the style controls — module and corner shapes, gradients, transparency and the logo panel with a live budget warning — and the presets. If you only need a plain black-and-white code, the simpler generator gets you there in one step."
    - q: "Can I use an SVG file as the logo?"
      a: "No, and the page says so rather than failing quietly. The logo is drawn into a canvas for the PNG export, and an SVG image loaded into a canvas taints it, which makes the export fail. PNG, JPEG, GIF, WebP and BMP all work."

jwt-editor:
  about: >-
    Build and sign a JSON Web Token in the browser. You edit the header and the
    payload as JSON, and the token line at the top is rebuilt as you type. Signing
    happens locally with WebCrypto, using a secret for HS256/384/512 or a PEM
    private key for RS, PS and ES algorithms — the key never leaves the page. The
    alg field in the header is rewritten to match the algorithm you choose, so the
    token cannot claim one algorithm while being signed with another.
  faq:
    - q: "Does this verify a token, or only create one?"
      a: "Only create. Verification — including the checks that a token claiming alg: none is refused and that an RSA key cannot be used to forge an HMAC — is what the JWT Parser tool does. Splitting them keeps each page honest about what it is doing: this one will happily sign whatever you give it, which is exactly what a forgery would look like, so it must never be mistaken for a check."
    - q: "Which key formats can I paste in?"
      a: "PEM. For RSA, both PKCS#8 (BEGIN PRIVATE KEY) and PKCS#1 (BEGIN RSA PRIVATE KEY) are accepted, because tools still emit both. For EC, PKCS#8 is required — an SEC1 EC PRIVATE KEY block is refused with an explanation rather than being half-parsed, because the curve is not named inside it and guessing it is how you sign with the wrong one."
    - q: "Why are the payload dates not shown as readable times?"
      a: "Because the payload is yours, not a schema. exp and iat are only numbers if you put them there, and an editor that rewrites your payload to show a date is an editor that changes what you are about to sign. The JWT Parser does annotate the registered claims, because reading a token that already exists is a different job."
    - q: "Is a token I sign here safe to use?"
      a: "Only for testing. The token is as good as the key you paste in, and this page has no idea whether that key belongs to your production system. Never paste a real signing key into a page you do not control, and treat any token built here as a throwaway."

http-request-tester:
  about: >-
    A request builder that also speaks curl. Paste a curl command and it is parsed
    into method, URL, headers and body; fill the form in and you can copy the
    equivalent curl command back out. The request itself is sent from your browser
    with fetch, straight to the address you type — nothing is relayed through this
    site, and no server of ours sees it. That also means the browser's own rules
    apply, which is the one thing this page cannot work around.
  faq:
    - q: "Why did a request fail with a CORS error instead of returning a response?"
      a: "Because a page cannot ignore the same-origin policy. The target has to allow cross-origin reads by answering with Access-Control-Allow-Origin, and if it does not, the browser blocks the reply before any script can read it. This is a rule of the browser, not a bug in the tool, and a static site has no server to proxy the request through — a proxy would also mean your headers, cookies and body passing through somebody else's machine. The page says this in the error rather than pretending the server is down."
    - q: "Which curl flags are supported?"
      a: "The ones that describe a request: -X, -H, -d, --data-raw, --data-binary, --data-urlencode, --json, -G, -I, -u, -b, -A, -e, -m, --url and the common clusters such as -sSL. Flags that ask for something a page cannot do — -k, -o, --http2, --cert, --limit-rate — are named in a \"Left out\" list rather than silently dropped, and flags that ask for something the browser already does, such as --compressed or -L, are reported as adjustments instead. The two lists are kept separate on purpose: mixing them teaches you to ignore the one that matters."
    - q: "Is the curl command I export the same as the one I pasted?"
      a: "For the parts that describe the request, yes — and where it differs, the page says so. Two examples it will tell you about: --data-binary sends no Content-Type at all in curl, while this form always sends one; and --data-urlencode encodes its value as a whole, where curl encodes only the part after the first =. Everything else, including -G moving data into the query string with the values percent-encoded, round-trips unchanged."
    - q: "Can I send cookies to another site?"
      a: "Only if the request is same-origin or the target explicitly allows credentials. Cross-origin fetch with credentials requires the server to answer with Access-Control-Allow-Credentials as well as a specific origin, and never a wildcard. The credentials dropdown lets you ask; the browser decides."

nginx-config-generator:
  about: >-
    Build an nginx server block by answering a few questions: which hostnames,
    static files or a reverse proxy, TLS or plain HTTP, caching, compression,
    security headers and logging. The output is a complete file you can drop into
    sites-available, and every line of a nested block is indented so it reads as
    the block it is. Anything the tool could not do properly is written into the
    output as a # !! comment rather than left in a status line, so a config that
    would not load cannot be mistaken for one that will.
  faq:
    - q: "Is the generated config checked against a real nginx?"
      a: "No, and that is worth being clear about. nginx is not installed on the machine this was built on, so the output is checked structurally — every server_name is validated against the hostname pattern, braces are balanced, indentation is consistent — and not with nginx -t. Read it before you reload, which is good practice with any generated config."
    - q: "Why is the www redirect written out as two server blocks?"
      a: "Because nginx has no variable that means \"this host without the leading www\". There is no way to derive one hostname from another inside a server block, so the only correct output is one redirect block per literal pair you typed. A single clever regex would silently fail for the domains it did not match."
    - q: "Why is http2 on; mentioned in the notes?"
      a: "Because that directive only exists from nginx 1.25.1 onwards; older versions used the http2 parameter on the listen line. The generated file uses the current form and the notes say which version it needs, so you find out before the reload fails rather than after."
    - q: "Why are the security headers repeated inside the cache location?"
      a: "Because add_header does not merge. A location block that sets any header of its own discards every add_header inherited from the parent, so the asset-cache block would quietly lose the security headers — on exactly the responses that are cached and served most often. Repeating them is the standard workaround, and the notes say why they are there twice."

image-metadata:
  about: >-
    Drop in a JPEG, PNG, GIF or WebP and read the metadata the file actually
    carries: camera make and model, exposure settings, orientation, dimensions,
    colour profile, PNG text chunks and, where present, GPS coordinates with a
    link that opens the location on OpenStreetMap. The parsing happens in the
    page, so the picture is never uploaded. A raw JSON panel shows every tag that
    was read, which is what you want when a field looks wrong.
  faq:
    - q: "Why does my image show no EXIF at all?"
      a: "Because most images no longer have any. Messaging apps, social networks and screenshot tools strip metadata on purpose, and any image that has been through an editor and re-exported usually loses it too. \"Read, but there is no EXIF in this file\" is a normal result, not an error — it does not mean the file carries nothing."
    - q: "Is the GPS location exact?"
      a: "It is exactly what the file says, to as many decimal places as the file stores. Many cameras write a rounded position, and some write a position that was never fixed at all, so a coordinate in a file is a claim by the camera rather than a measurement you can rely on. The page shows the degrees, minutes and seconds it read alongside the decimal pair so you can check the conversion yourself."
    - q: "Can it remove metadata?"
      a: "No. It only reads. Stripping metadata means re-encoding the image, which is a different tool and a lossy one — and it is worth knowing that the reliable way to remove EXIF is to re-export the picture from an editor, or to use a dedicated metadata stripper, rather than to trust a viewer."
    - q: "Which formats are supported, and why those four?"
      a: "JPEG, PNG, GIF and WebP — the four whose metadata can be read from the file structure alone without a decoder. TIFF shares EXIF's structure with JPEG and is read where it appears inside one of these, but a standalone .tif is not accepted, because supporting it properly means supporting every TIFF variant including the ones that are not images at all."

file-hash-checker:
  about: >-
    Compute MD5, SHA-1, SHA-256 and SHA-512 for a file in your browser, then check
    the result against a hash you were given. The file is read locally and never
    uploaded. Pasting a published digest — including a whole sha256sum line — turns
    the result into a verdict rather than a row of hex for you to compare by eye,
    and re-pasting a different digest re-compares without reading the file again.
  faq:
    - q: "Is MD5 still worth using?"
      a: "For checking that a download arrived intact, yes, and it is still what a lot of publishers list. For anything where someone might have a reason to give you a file that differs from the one you asked for, no — MD5 and SHA-1 are both broken for that purpose and collisions can be constructed deliberately. Use SHA-256 for anything security-related. The page offers all four because the digest you were given decides which one you need, not the other way round."
    - q: "Why is SHA-512 off by default?"
      a: "Because it is rarely the one published, and every algorithm you tick is another pass over the file. All four can be ticked at once if you want them; the checkboxes only control which rows are computed."
    - q: "What happens with a very large file?"
      a: "It is hashed in chunks, so memory does not grow with the file — but there is a 256 MB ceiling, and the page states it up front rather than failing halfway. Beyond that, use sha256sum on the command line, which is faster and has no such limit."
    - q: "I pasted a hash and it said the lengths are not comparable. What does that mean?"
      a: "That the digest you pasted is a different length from every algorithm currently ticked, so the two cannot be compared at all. Calling that a mismatch would be a false accusation against the file, so the page says which of the two situations you are in and tells you to tick the matching algorithm."

ssh-key-generator:
  about: >-
    Generate an SSH key pair in the browser — Ed25519, ECDSA on P-256, P-384 or
    P-521, or RSA at 2048, 3072 or 4096 bits — and download the private key in the
    format your own ssh reads. The private key is OpenSSH's native
    openssh-key-v1 container, which is what ssh-keygen writes and what ssh accepts,
    with a PKCS#8 PEM copy offered beside it for tools that want one. Keys are
    generated locally with WebCrypto and are never sent anywhere.
  faq:
    - q: "Why is the private key in OpenSSH format instead of PKCS#8?"
      a: "Because PKCS#8 Ed25519 is not readable by OpenSSH. Measured on OpenSSH 9.6, ssh-keygen -y on a PKCS#8 Ed25519 key fails with \"invalid format\", while the same key in the openssh-key-v1 container works. PKCS#8 is convenient and widely supported by other tools, so it is offered as a second, clearly labelled panel — but the file you download for ssh is the one ssh can actually open. Claiming the wrong one is portable would be worse than the extra panel."
    - q: "How do I use the key once I have downloaded it?"
      a: "Save the private key, then chmod 600 it — ssh refuses to read a private key that anyone else can open, and that refusal is a feature. Copy the public key into ~/.ssh/authorized_keys on the server, or hand it to whatever service you are setting up. The public key is the one-line ssh-ed25519 or ssh-rsa form that starts with the key type."
    - q: "Which key type should I pick?"
      a: "Ed25519 unless you have a reason not to: it is small, fast, and has no parameter choices to get wrong. Use RSA if you have to talk to something old — 3072 bits or more, since 2048 is the floor rather than a recommendation. ECDSA is there for compatibility with systems that expect it; it is fine, but there is no advantage over Ed25519 on a modern system."
    - q: "Are the fingerprints real, or does the page just make them up?"
      a: "They are computed from the same wire format ssh uses, and they were checked against ssh-keygen as an independent oracle — both the SHA-256 and the MD5 form, for every key type the page offers. The private key was checked further: a real ssh-keygen -Y sign and -Y verify round trip, plus openssl pkey -check on the PKCS#8 copy. That is stronger evidence than the page agreeing with itself, but it was measured on Linux OpenSSH 9.6 — older OpenSSH and Windows tools such as puttygen are untested here."

websocket-tester:
  about: >-
    Open a WebSocket from your browser, send text or binary frames, and watch
    everything that arrives in a timestamped log. The connection is made by the
    page itself, so it goes from your machine to the server you name and through
    nothing else. Binary frames can be typed as hex and are converted for you, and
    JSON that comes back is indented so it is readable. Close codes are explained
    rather than just printed.
  faq:
    - q: "Why can I not connect to a ws:// address from this page?"
      a: "Because the page is served over https, and a browser refuses to open an insecure WebSocket from a secure page — it would be a hole in the padlock. This is a mixed-content rule enforced by the browser, not a setting here. Use wss://, or run the test from a page served over plain http, or use a command-line client such as websocat for a local ws:// endpoint. The page allows ws:// to localhost, which browsers treat as trustworthy."
    - q: "What does close code 1006 mean?"
      a: "That the connection closed without a close frame — no proper handshake, no reason string. It is what you see when the server process died, a proxy dropped the connection, or the network went away, and it is deliberately not a code a server can send you. The log spells this out because 1006 on its own looks like a mystery number."
    - q: "Can I send binary data?"
      a: "Yes. Tick \"Send as binary\" and type the bytes as hex, and the page converts them to an ArrayBuffer before sending. Anything that is not valid hex is refused with a message rather than being sent as something else. Replies are labelled as text or binary in the log, and binary replies are shown as hex."
    - q: "How do I connect with a subprotocol?"
      a: "Type them in the subprotocol field, comma separated — for example chat, superchat. The server picks one and the log records which one it chose, which is the part people actually need to see when a handshake succeeds but the application protocol is wrong."

