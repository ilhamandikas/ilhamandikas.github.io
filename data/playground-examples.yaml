          if (n < 2) return 0;
          for (int d = 2; d * d <= n; d++) if (n % d == 0) return 0;
          return 1;
      }

      int main(void) {
          printf("Primes:");
          for (int n = 2; n <= 30; n++) if (is_prime(n)) printf(" %d", n);
          printf("\n");
          return 0;
      }
