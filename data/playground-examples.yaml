    category: Arrays and search
    hint: "Sort [8, 3, 5, 1, 9] into [1, 3, 5, 8, 9]."
    code: |
      values = [8, 3, 5, 1, 9]
      (values.length - 1).downto(1) do |last|
        last.times do |i|
          values[i], values[i + 1] = values[i + 1], values[i] if values[i] > values[i + 1]
        end
      end
      puts "Sorted: #{values.inspect}"
  - name: Binary search
    category: Arrays and search
    hint: "Search the sorted list for 7; its zero-based index is 3."
    code: |
      def binary_search(sorted_values, target)
        left, right = 0, sorted_values.length - 1
        while left <= right
          middle = (left + right) / 2
          return middle if sorted_values[middle] == target
          if sorted_values[middle] < target
            left = middle + 1
          else
            right = middle - 1
          end
        end
        -1
      end
      puts "Index: #{binary_search([1, 3, 5, 7, 9], 7)}"
