    category: Arrays and search
    hint: "Searching a sorted array for 23 returns index 5."
    code: |
      #include <stdio.h>

      int binary_search(const int *values, int count, int target) {
          int low = 0, high = count - 1;
          while (low <= high) {
              int mid = low + (high - low) / 2;
              if (values[mid] == target) return mid;
              if (values[mid] < target) low = mid + 1;
              else high = mid - 1;
          }
          return -1;
      }

      int main(void) {
          int values[] = {2, 5, 8, 12, 16, 23, 38};
          int count = (int)(sizeof(values) / sizeof(values[0]));
          printf("Index of 23: %d\n", binary_search(values, count, 23));
          return 0;
      }
