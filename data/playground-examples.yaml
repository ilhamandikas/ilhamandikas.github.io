      def binary_search(sorted_values, target):
          left, right = 0, len(sorted_values) - 1
          while left <= right:
              middle = (left + right) // 2
              if sorted_values[middle] == target:
                  return middle
              if sorted_values[middle] < target:
                  left = middle + 1
              else:
                  right = middle - 1
          return -1

