  - name: Bubble sort
    category: Arrays and search
    hint: "Sort [8, 3, 5, 1, 9] into [1, 3, 5, 8, 9]."
    code: |
      const values = [8, 3, 5, 1, 9];
      for (let end = values.length - 1; end > 0; end--) {
        for (let i = 0; i < end; i++) {
          if (values[i] > values[i + 1]) {
            [values[i], values[i + 1]] = [values[i + 1], values[i]];
          }
        }
      }
      console.log('Sorted:', values);
  - name: Binary search
    category: Arrays and search
    hint: "Search the sorted array for 7; its zero-based index is 3."
    code: |
      function binarySearch(sorted, target) {
        let left = 0;
        let right = sorted.length - 1;
        while (left <= right) {
          const middle = Math.floor((left + right) / 2);
          if (sorted[middle] === target) return middle;
          if (sorted[middle] < target) left = middle + 1;
          else right = middle - 1;
        }
        return -1;
      }
      console.log('Index:', binarySearch([1, 3, 5, 7, 9], 7));
