    code: |
      class BankAccount
        attr_reader :balance
        def initialize
          @balance = 0
        end
        def deposit(amount)
          raise ArgumentError, 'Deposit must be positive.' unless amount > 0
          @balance += amount
        end
        def withdraw(amount)
          raise ArgumentError, 'Invalid withdrawal.' unless amount > 0 && amount <= @balance
          @balance -= amount
        end
      end
