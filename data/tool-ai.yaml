# Optional AI metadata that cannot be derived from the catalog or the guide.
# Keyed by tool slug. Anything here overrides the generated defaults, so keep it
# small: most tools already get their keywords from data/tools.yaml and their
# example questions from the FAQ in each tool guide (content/guides/*.md).

tar-command-builder:
  features:
    - Generate GNU tar create, list, and extract commands
    - Choose creation compression and GNU tar exclude patterns
    - List an archive before extracting and optionally strip path components
    - Refuse existing extraction files by default and explain overwrite risks
  input:
    type: form
    format: Archive path, operation, source or destination, and options
    sensitive: true
  output:
    type: text
    format: POSIX shell commands for GNU tar
  limitations:
    - Generates text only; no file inspection or execution
    - GNU tar required; compression programs must be installed separately
    - No stdin/stdout pipelines, tilde expansion, or parent-path segments in source members
    - Extraction options do not make untrusted archives safe
  related_tools:
    - rsync-command-builder
    - zip-builder

rsync-command-builder:
  features:
    - Generate local copy and SSH upload or download directory commands
    - Enable dry-run by default with a separate preview command
    - Explain directory versus contents source trailing-slash behavior
    - Require renewed acknowledgement before a real destination-deletion command
    - Configure excludes, checksums, compression, and bandwidth limits
  input:
    type: form
    format: Directory paths, optional SSH endpoint, and transfer settings
    sensitive: true
  output:
    type: text
    format: POSIX shell rsync commands
  limitations:
    - No connection, filesystem inspection, or command execution
    - SSH modes require rsync 3.0+ on both sides and hostname or IPv4 endpoints
    - No IPv6 hosts, daemon mode, remote-to-remote transfers, wildcard paths, or file-only copies
    - Cannot detect symlink aliases, overlapping trees, missing mounts, or all dangerous paths
  related_tools:
    - tar-command-builder
    - ssh-tunnel-builder

log-redactor:
  features:
    - Replace common sensitive-field lines and PEM private-key blocks
    - Detect URL credentials, JWT-like tokens, common emails, IPv4, and IPv6
    - Add case-sensitive exact-text redactions without regex
    - Preview results and overlapping per-category match counts
    - Copy or download only the redacted preview
  input:
    type: text
    format: Log excerpt and optional exact-text entries
    sensitive: true
  output:
    type: text
    format: Redacted log with a fixed marker
  limitations:
    - Best-effort pattern detection, not an anonymization or secret-removal guarantee
    - Sensitive fields redact the rest of a line and ambiguous values can hide the remaining input
    - Output may no longer be valid JSON or logfmt
    - No comprehensive encoded-secret, arbitrary multiline, or personal-data detection
    - Maximum 500,000 log characters and 20,000 detected matches
  related_tools:
    - docker-logs-grep
    - log-parser
    - string-obfuscator

systemd-service-builder:
  features:
    - Generate a system-level Type=simple unit for a foreground application
    - Configure a non-root user and optional group and environment file
    - Quote literal arguments without shell execution or variable expansion
    - Download the unit and copy installation and log commands
    - Add optional network ordering and NoNewPrivileges and PrivateTmp
  input:
    type: form
    format: Service settings and one literal argument per line
    sensitive: true
  output:
    type: text
    format: systemd service unit and shell commands
  limitations:
    - No installation, execution, or server validation
    - Only foreground Type=simple system services with an existing non-root user
    - No empty arguments, standalone semicolon arguments, or variable expansion
    - Conventional lowercase Linux account names only
    - Absolute paths only; backslashes in paths are not supported
  related_tools:
    - linux-ops
    - nginx-reverse-proxy-wizard
    - env-diff-checker

tls-certificate-decoder:
  features:
    - Decode core X.509 certificate fields and SANs
    - Inspect UTC validity dates against the device clock
    - Compute a SHA-256 certificate fingerprint
    - Decode up to 20 PEM certificates in input order
  input:
    type: text
    format: X.509 CERTIFICATE PEM blocks
    sensitive: true
  output:
    type: text
    format: Decoded certificate report
  limitations:
    - No signature, trust chain, hostname, or revocation verification
    - No remote server connection
    - Only SAN extensions are decoded; others are listed by OID
    - RSA-PSS parameters and uncommon name string types are not decoded
    - PEM only, with a 1,000,000-character input limit
  related_tools:
    - nginx-reverse-proxy-wizard
    - file-hash-checker

env-diff-checker:
  features:
    - Compare missing, changed, unchanged, and empty values
    - Hide result values by default
    - Copy a key-only report
    - Reject duplicate keys and unsupported syntax
  input:
    type: text
    format: Two single-line .env configurations
    sensitive: true
  output:
    type: table
    format: Key statuses and optionally revealed literal values
  limitations:
    - Single-line assignments only; no multiline values
    - Variable references and escapes are not expanded
    - Duplicate keys are rejected
    - Input text is visible; only result values are masked
  related_tools:
    - env-key-sorter
    - text-diff

linux-ops:
  use_cases:
    - check which process uses a port
    - find what is filling the disk
    - debug an nginx 502 or 503
    - inspect a crash-looping Docker container
    - read journalctl and systemctl output
    - check memory pressure and swap
  examples:
    - How to check which process uses port 8080?
    - How to find large files on Ubuntu?
    - Nginx returns 503, what should I check?
    - Which command shows memory usage per process?

cron-next-runs:
  use_cases:
    - explain a cron expression
    - see the next run times
    - check a crontab schedule
  examples:
    - What does 0 3 * * * mean?
    - When does */15 9-17 * * 1-5 run next?

nginx-config-generator:
  use_cases:
