      name: Base64 File
      desc: Turn any file into a Base64 data string, or decode one back to a file.
      keywords: [base64, file, encode, decode, data uri]
      status: done
    - slug: url-encoder
      name: URL Encoder
      desc: Percent-encode and decode URL components.
      keywords: [url, uri, encode, decode, percent, escape]
      status: done
    - slug: html-entities
      name: HTML Entities
      desc: Escape and unescape HTML special characters.
