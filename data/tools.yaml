# Tool catalog — single source of truth for the /tools/ menu, catalog and search.
# Fields: slug, name, desc, keywords, status (done | planned)
# Grouped by our own taxonomy (not the upstream project's).

- name: Encoding
  slug: encoding
  tools:
    - slug: base64-string-converter
      name: Base64 Text
      desc: Encode and decode UTF-8 text to and from Base64, URL-safe optional.
      keywords: [base64, encode, decode, text, string]
      status: done
