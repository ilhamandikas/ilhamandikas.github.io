baseURL = "https://ilham.dev/"
languageCode = "en"
defaultContentLanguage = "en"
title = "ilham.dev"
enableRobotsTXT = true
paginate = 10
summaryLength = 30
timeZone = "Asia/Jakarta"

[params]
  author = "Ilham Andika"
  email = "hai@ilham.dev"
  github = "https://github.com/ilhamandikas"
  description = "Ilham Andika — notes on backend, servers, infrastructure, and automation: what I build, what breaks, and what I learn."
  gravatarSize = 240

# Comments via giscus (GitHub Discussions). Values come from https://giscus.app.
[params.giscus]
  repo = "ilhamandikas/ilhamandikas.github.io"
  repoid = "R_kgDOUiew2A"
  category = "Announcements"
  categoryid = "DIC_kwDOUiew2M4DGBNS"
  mapping = "pathname"
  reactions = "1"
  inputposition = "bottom"
  theme = "light"
  lang = "en"

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.goldmark.renderer]
    unsafe = false

# --- AI discovery --------------------------------------------------------------
# Everything under /tools/*.json and /llms.txt is generated from data/tools.yaml
# (plus data/tool-guides.yaml and the optional data/tool-ai.yaml overlay), so the
# registry, the LLM index and the search index can never drift from the catalog
# the site itself renders. Nothing extra has to be committed or built with npm.
[mediaTypes."text/markdown"]
  suffixes = ["md"]
  delimiter = ""

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.ToolsJSON]
  mediaType = "application/json"
  baseName = "tools"
  isPlainText = true
  notAlternative = true

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputFormats.Markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
