<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Camera — Aninda & Ilham</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080808;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{position:fixed;inset:0;background:#000}.top{position:absolute;z-index:8;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);text-align:center;pointer-events:none}.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.72}.title{font:500 22px Georgia,serif;margin-top:4px}.viewer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#090909}.viewer video,.viewer canvas{width:100%;height:100%;object-fit:cover}#previewCanvas{display:none;object-fit:contain;background:#111}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:34px;text-align:center;background:radial-gradient(circle at 50% 5%,#31271f,#0a0a0a 58%)}.card{max-width:420px}.card h1{font:500 36px/1.08 Georgia,serif;margin:0 0 14px}.card p{margin:0;color:#d8d3ce;line-height:1.55}.start{margin-top:26px;border:0;border-radius:999px;padding:15px 24px;font-size:16px;font-weight:750;background:#fff;color:#111}.controls{position:absolute;z-index:9;left:0;right:0;bottom:0;padding:18px 20px calc(env(safe-area-inset-bottom) + 24px);display:none;justify-content:center;align-items:center;gap:14px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent)}.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.22);box-shadow:0 0 0 3px rgba(0,0,0,.3)}.btn{border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:750}.secondary{background:#fff;color:#111}.primary{background:#f4eadf;color:#231d18}.frame-panel{position:absolute;z-index:10;left:0;right:0;bottom:0;display:none;padding:12px 12px calc(env(safe-area-inset-bottom) + 78px);background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.8) 72%,transparent 100%)}.frame-title{text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.72;margin-bottom:9px}.frames{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;scrollbar-width:none}.frames::-webkit-scrollbar{display:none}.frame-chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 14px;font-size:13px}.frame-chip.active{background:#f4eadf;color:#231d18;border-color:#f4eadf}.preview-actions{position:absolute;z-index:11;left:0;right:0;bottom:0;display:none;justify-content:center;gap:12px;padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);background:#090909}.status{position:absolute;z-index:12;left:16px;right:16px;bottom:142px;text-align:center;font-size:13px;text-shadow:0 1px 8px #000;pointer-events:none}.success{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at top,#2d251f,#101010 60%);text-align:center;padding:30px}.success h2{font:500 36px Georgia,serif;margin:0 0 10px}.success p{color:#d0cbc6;line-height:1.5}.success .btn{margin-top:16px}.badge{display:inline-block;margin-bottom:14px;padding:7px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-size:12px;opacity:.85}
</style>
</head>
<body>
<main class="app"><div class="top"><div class="kicker">Wedding Camera</div><div class="title">Aninda & Ilham</div></div><div class="viewer"><div id="empty" class="empty"><div class="card"><div class="badge">26.12.2026</div><h1>Abadikan momen hari ini.</h1><p>Foto bisa portrait atau landscape. Setelah memotret, pilih original atau frame wedding favoritmu.</p><button class="start" id="start">Buka Kamera</button></div></div><video id="video" autoplay playsinline muted></video><canvas id="previewCanvas"></canvas></div><canvas id="sourceCanvas" hidden></canvas><div id="cameraControls" class="controls"><button id="capture" class="shutter" aria-label="Ambil foto"></button></div><div id="framePanel" class="frame-panel"><div class="frame-title">Pilih hasil foto</div><div class="frames"><button class="frame-chip active" data-frame="original">Original</button><button class="frame-chip" data-frame="minimal">Minimal White</button><button class="frame-chip" data-frame="botanical">Botanical</button><button class="frame-chip" data-frame="classic">Classic Wedding</button></div></div><div id="previewActions" class="preview-actions"><button id="retake" class="btn secondary">Foto ulang</button><button id="upload" class="btn primary">Kirim foto</button></div><div id="status" class="status"></div><section id="success" class="success"><div><div class="badge">Terkirim ✓</div><h2>Terima kasih ♡</h2><p>Foto original sudah tersimpan.<br>Jika memilih frame, versi frame juga ikut tersimpan.</p><button id="again" class="btn primary">Ambil foto lagi</button></div></section></main>
<script>
const video=document.getElementById('video'),source=document.getElementById('sourceCanvas'),preview=document.getElementById('previewCanvas');const empty=document.getElementById('empty'),cameraControls=document.getElementById('cameraControls'),framePanel=document.getElementById('framePanel'),previewActions=document.getElementById('previewActions'),status=document.getElementById('status'),success=document.getElementById('success');let stream=null,originalData=null,selected='original';async function startCamera(){status.textContent='';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}},audio:false});video.srcObject=stream;empty.style.display='none';video.style.display='block';preview.style.display='none';cameraControls.style.display='flex';framePanel.style.display='none';previewActions.style.display='none'}catch(e){status.textContent='Kamera tidak bisa dibuka. Cek izin kamera browser lalu coba lagi.'}}document.getElementById('start').onclick=startCamera;document.getElementById('capture').onclick=()=>{if(!video.videoWidth)return;let w=video.videoWidth,h=video.videoHeight,max=2200;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}source.width=w;source.height=h;source.getContext('2d').drawImage(video,0,0,w,h);originalData=source.toDataURL('image/jpeg',.92);selected='original';document.querySelectorAll('.frame-chip').forEach(x=>x.classList.toggle('active',x.dataset.frame==='original'));renderPreview();video.style.display='none';preview.style.display='block';cameraControls.style.display='none';framePanel.style.display='block';previewActions.style.display='flex'};function fitPhoto(ctx,img,W,H,t,r,b,l){const aw=W-l-r,ah=H-t-b,k=Math.max(aw/img.width,ah/img.height),w=img.width*k,h=img.height*k;ctx.drawImage(img,l+(aw-w)/2,t+(ah-h)/2,w,h)}function drawFlower(ctx,x,y,s){ctx.save();ctx.translate(x,y);ctx.fillStyle='#f6f0e8';for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,-s*.34,s*.18,s*.38,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#c7a96b';ctx.beginPath();ctx.arc(0,0,s*.11,0,Math.PI*2);ctx.fill();ctx.restore()}function drawLeaves(ctx,x,y,s,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(flip,1);ctx.strokeStyle='#8a9a78';ctx.lineWidth=Math.max(2,s*.03);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.3,-s*.25,s*.65,-s*.55);ctx.stroke();ctx.fillStyle='#91a181';for(let i=1;i<=3;i++){const px=s*.18*i,py=-s*.17*i;ctx.beginPath();ctx.ellipse(px,py,s*.12,s*.055,-.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(px+s*.08,py+s*.1,s*.11,s*.05,.7,0,Math.PI*2);ctx.fill()}ctx.restore()}function renderPreview(){const img=new Image();img.onload=()=>{const portrait=img.height>=img.width;let W=portrait?1080:1600,H=portrait?1440:1000;preview.width=W;preview.height=H;const ctx=preview.getContext('2d');ctx.clearRect(0,0,W,H);if(selected==='original'){fitPhoto(ctx,img,W,H,0,0,0,0);return}ctx.fillStyle='#f7f3ed';ctx.fillRect(0,0,W,H);if(selected==='minimal'){const m=Math.round(Math.min(W,H)*.045),bottom=portrait?210:155;fitPhoto(ctx,img,W,H,m,m,bottom,m);ctx.strokeStyle='#ded7ce';ctx.lineWidth=2;ctx.strokeRect(m,m,W-2*m,H-m-bottom);ctx.fillStyle='#3c332c';ctx.textAlign='center';ctx.font=`italic ${portrait?54:42}px Georgia`;ctx.fillText('Aninda & Ilham',W/2,H-bottom*.43);ctx.font=`${portrait?24:20}px Georgia`;ctx.fillText('26.12.2026',W/2,H-bottom*.18)}else if(selected==='botanical'){const m=Math.round(Math.min(W,H)*.04);fitPhoto(ctx,img,W,H,m,m,m,m);ctx.strokeStyle='#c7a96b';ctx.lineWidth=3;ctx.strokeRect(m,m,W-2*m,H-2*m);const s=Math.min(W,H)*.24;drawLeaves(ctx,m*1.1,m*1.2,s,1);drawFlower(ctx,m+s*.35,m+s*.05,s*.42);drawLeaves(ctx,W-m*1.05,H-m*1.1,s,-1);drawFlower(ctx,W-m-s*.28,H-m-s*.02,s*.38);ctx.fillStyle='rgba(247,243,237,.92)';ctx.fillRect(W*.27,H*.86,W*.46,H*.09);ctx.fillStyle='#4b4036';ctx.textAlign='center';ctx.font=`italic ${portrait?42:34}px Georgia`;ctx.fillText('Aninda & Ilham',W/2,H*.905);ctx.font=`${portrait?21:18}px Georgia`;ctx.fillText('26.12.2026',W/2,H*.94)}else{const m=Math.round(Math.min(W,H)*.045),bottom=portrait?180:135;fitPhoto(ctx,img,W,H,m,m,bottom,m);ctx.strokeStyle='#b99550';ctx.lineWidth=4;ctx.strokeRect(m,m,W-2*m,H-m-bottom);ctx.strokeStyle='#dbc494';ctx.lineWidth=2;ctx.strokeRect(m+14,m+14,W-2*m-28,H-m-bottom-28);drawFlower(ctx,m*1.35,m*1.35,Math.min(W,H)*.08);drawFlower(ctx,W-m*1.35,H-bottom-m*.9,Math.min(W,H)*.07);ctx.fillStyle='#efe2c9';ctx.fillRect(W*.19,H-bottom*.88,W*.62,bottom*.66);ctx.strokeStyle='#b99550';ctx.lineWidth=2;ctx.strokeRect(W*.19,H-bottom*.88,W*.62,bottom*.66);ctx.fillStyle='#7a5b2c';ctx.textAlign='center';ctx.font=`italic ${portrait?50:38}px Georgia`;ctx.fillText('Aninda & Ilham',W/2,H-bottom*.52);ctx.font=`${portrait?23:18}px Georgia`;ctx.fillText('26.12.2026',W/2,H-bottom*.27)}};img.src=originalData}document.querySelectorAll('.frame-chip').forEach(btn=>btn.onclick=()=>{selected=btn.dataset.frame;document.querySelectorAll('.frame-chip').forEach(x=>x.classList.toggle('active',x===btn));renderPreview()});document.getElementById('retake').onclick=()=>{originalData=null;selected='original';preview.style.display='none';video.style.display='block';framePanel.style.display='none';previewActions.style.display='none';cameraControls.style.display='flex';status.textContent=''};async function send(dataUrl){const r=await fetch('/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dataUrl})});let j;try{j=await r.json()}catch{throw new Error('Respons backend tidak valid')}if(!r.ok||j.success!==true)throw new Error(j.error||'Upload gagal');return j}document.getElementById('upload').onclick=async()=>{if(!originalData)return;const b=document.getElementById('upload');b.disabled=true;b.textContent='Mengirim…';status.textContent='Menyimpan foto original…';try{await send(originalData);if(selected!=='original'){status.textContent='Menyimpan versi frame…';await send(preview.toDataURL('image/jpeg',.92))}framePanel.style.display='none';previewActions.style.display='none';status.textContent='';success.style.display='flex'}catch(e){status.textContent='Upload gagal: '+(e?.message||'Coba lagi.')}finally{b.disabled=false;b.textContent='Kirim foto'}};document.getElementById('again').onclick=()=>{success.style.display='none';originalData=null;selected='original';preview.style.display='none';video.style.display='block';framePanel.style.display='none';previewActions.style.display='none';cameraControls.style.display='flex';status.textContent=''};
</script>
</body></html>
